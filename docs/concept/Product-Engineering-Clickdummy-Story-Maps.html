function insertVaultAtCaret() {
  const editor=$('workspace').querySelector('[data-rich-editor]');
  if (!editor) return;
  trackEditorSelection();
  const range=savedEditorRange && editor.contains(savedEditorRange.commonAncestorContainer)
    ? savedEditorRange.cloneRange() : null;
  const projectId=project().id;
  chooseVaultReference((entry,options)=>{
    if (!editor.isConnected || project().id!==projectId) return;
    editor.focus({preventScroll:true});
    const selection=window.getSelection();
    const position=range || document.createRange();
    if (!range) {position.selectNodeContents(editor);position.collapse(false);}
    const selected=position.toString().trim();
    const alias=selected && !/[\[\]|\r\n]/.test(selected) ? '|'+selected : '';
    const text=(options?.embed?'!':'')+'[['+entry.path+alias+']]';
    selection.removeAllRanges();
    selection.addRange(position);
    if (!document.execCommand('insertText',false,text)) {
      const inserted=document.createTextNode(text);
      position.deleteContents(); position.insertNode(inserted); position.setStartAfter(inserted); position.collapse(true);
      selection.removeAllRanges(); selection.addRange(position);
    }
    editor.dataset.dirty='true';
    if (editor.closest('form')) editor.closest('form').dataset.unsaved='true';
    trackEditorSelection();
  },{allowEmbed:true});
}


const editCommands = [
  ['Absatz','paragraph','¶'],['Überschrift','heading','H2'],['Fett','bold','B'],['Kursiv','italic','I'],['Aufzählung','bullets','Liste'],['Nummerierte Liste','numbered','1. Liste'],['Zitat','quote','Zitat'],['Link','link','Link'],['Vault-Verweis','vault','Vault-Verweis']
];

function richEditor(body,label='Inhalt') {
  const content=markdownHTML(body,true).replace(/<\/h[1-6]>(?=<h[1-6](?:\s|>)|$)/g,'$&<p data-editor-answer><br></p>');
  return `<div class="rich-editor"><div class="editor-tools" role="group" aria-label="Formatierung">${editCommands.map(([name,command,symbol])=>`<button type="button" class="btn small editor-command" data-action="format-editor" data-id="${command}" aria-label="${e(name)}" title="${e(name)}">${e(symbol)}</button>`).join('')}</div><div class="editor-surface prose" data-rich-editor role="textbox" aria-multiline="true" aria-label="${e(label)}" contenteditable="true" spellcheck="true">${content || '<p><br></p>'}</div><input type="hidden" name="body" value="${e(body)}"><div class="editor-footer"><span>Speichert als Markdown</span>${btn('Markdown-Vorschau','editor-preview',{style:'small quiet',symbol:'code'})}</div></div>`;
}

function toMarkdown(editor) {
  function walk(node) {
    if (node.nodeType===Node.TEXT_NODE) return node.textContent.replace(/\u00a0/g,' ');
    const tag=node.nodeName.toLowerCase();
    const inside=()=>[...node.childNodes].map(walk).join('');
    if (tag==='p' && node.hasAttribute('data-editor-answer') && !node.textContent.trim()) return '';
    if (tag==='br') return '\n';
    if (['p','div'].includes(tag)) return `${inside().trim()}\n\n`;
    if (/^h[1-6]$/.test(tag)) return `${'#'.repeat(Number(tag[1]))} ${inside().trim()}\n\n`;
    if (['strong','b'].includes(tag)) return `**${inside()}**`;
    if (['em','i'].includes(tag)) return `*${inside()}*`;
    if (tag==='code') {
      const marker=node.dataset.codeMarker||'`';
      return marker+node.textContent+marker;
    }
    if (tag==='pre') {
      const marker=node.dataset.fenceMarker||'```',end=node.dataset.fenceEnd??marker;
      return marker+(node.dataset.fenceInfo||'').replace(/[\r\n]/g,'')+'\n'+node.textContent+(end?'\n'+end:'')+'\n\n';
    }
    if (tag==='blockquote') return `${inside().trim().split('\n').map(l=>`> ${l}`).join('\n')}\n\n`;
    if (tag==='ul'||tag==='ol') return `${[...node.children].map((li,i)=>`${tag==='ul'?'-':`${i+(node.start||1)}.`} ${[...li.childNodes].map(walk).join('').trim()}`).join('\n')}\n\n`;
    if (tag==='a') {
      const href=node.getAttribute('href')||'';
      return /^https?:\/\/[^\s)]+$/i.test(href)?`[${inside()}](${href})`:inside();
    }
    return inside();
  }
  return [...editor.childNodes].map(walk).join('').trim();
}

let savedEditorRange=null;
function trackEditorSelection() {
  const editor=document.querySelector('[data-rich-editor]');
  const selection=window.getSelection();
  if (editor && selection.rangeCount && editor.contains(selection.anchorNode)) savedEditorRange=selection.getRangeAt(0).cloneRange();
}

function restoreEditorSelection(editor) {
  const selection=window.getSelection();
  editor.focus({preventScroll:true});
  if (savedEditorRange && editor.contains(savedEditorRange.startContainer)) {
    selection.removeAllRanges(); selection.addRange(savedEditorRange);
  } else if (!editor.contains(selection.anchorNode)) {
    const range=document.createRange(); range.selectNodeContents(editor); range.collapse(false);
    selection.removeAllRanges(); selection.addRange(range);
  }
  return selection;
}

function applyEditor(command,url='') {
  const editor=document.querySelector('[data-rich-editor]');
  if (!editor) return;
  const selection=restoreEditorSelection(editor);
  const commandMap={paragraph:['formatBlock','p'],heading:['formatBlock','h2'],bold:['bold'],italic:['italic'],bullets:['insertUnorderedList'],numbered:['insertOrderedList'],quote:['formatBlock','blockquote']};
  if (command==='link') {
    if (!/^https?:\/\/[^\s)]+$/i.test(url)) return;
    if (selection.isCollapsed) document.execCommand('insertHTML',false,`<a href="${e(url)}">${e(url)}</a>`);
    else document.execCommand('createLink',false,url);
  } else if (commandMap[command]) {
    const [name,value]=commandMap[command];
    document.execCommand(name,false,value);
  } else return;
  editor.dataset.dirty='true';
}

function editorValue(el) {
  const surface=el.querySelector('[data-rich-editor]');
  return surface?.dataset.dirty ? toMarkdown(surface) : el.elements.namedItem('body')?.value;
}

function gitItem(id) { return getDoc(id) || backlogItem(id); }

function modelNoteRelations(note) {
  return domainEdges().filter(edge=>edge.fromId===note.id||edge.toId===note.id);
}

function modelNoteMarkdown(note,properties) {
  const attributes=Array.isArray(note.domainAttributes)?note.domainAttributes:[];
  const edges=[...(note.domainRelations||[]).map(edge=>({...edge,fromId:note.id})),
    ...modelNoteRelations(note).filter(edge=>edge.fromId!==note.id)];
  const otherIds=[...new Set(edges.map(edge=>edge.fromId===note.id?edge.toId:edge.fromId))];
  if (attributes.length) properties.push(`pe-attribute: ${JSON.stringify(attributes.map(attr=>attr.name))}`);
  if (otherIds.length) properties.push(`pe-entitaeten: ${JSON.stringify(otherIds.map(id=>`[[${id}]]`))}`);
  if (note.domainTargets?.length) properties.push('pe-produktbezug: '+JSON.stringify(note.domainTargets.map(entityTargetKey).sort()));
  if (note.domainArchived) properties.push('pe-archiviert: true');
  const oneLine=value=>String(value||'').replace(/\s+/g,' ').trim().replace(/[\\`*_[\]<>]/g,'\\$&');
  const parts=[];
  if (attributes.length) parts.push('## Fachliche Attribute','',...attributes.map(attr=>`- ${oneLine(attr.name)}${attr.description?' – '+oneLine(attr.description):''}`));
  if (edges.length) {
    if (parts.length) parts.push('');
    parts.push('## Fachliche Beziehungen','');
    // IDs stay stable when a connected note is renamed.
    for (const edge of edges) {
      const from=edge.fromId===note.id?oneLine(note.title):`[[${edge.fromId}]]`;
      const to=edge.toId===note.id?oneLine(note.title):`[[${edge.toId}]]`;
      parts.push(`- ${from} (${edge.fromCard}) ${oneLine(edge.verb)} ${to} (${edge.toCard}) · ${oneLine(edge.id)}`);
      if (edge.description) parts.push(`  Fachliche Regel: ${oneLine(edge.description)}`);
    }
  }
  if (note.domainTargets?.length) {
    if (parts.length) parts.push('');
    parts.push('## Produktumfang','');
    for (const ref of note.domainTargets) {
      if (ref.kind==='map') parts.push(`- Story Map · ${oneLine(ref.id)}`);
      else parts.push(`- ${ref.kind==='prd'?'PRD':'Backlog-Eintrag'} · [[${ref.id}]]`);
    }
  }
  return parts.length?'\n\n'+parts.join('\n'):'';
}

function itemMarkdown(item) {
  if (item.type==='PBI') return pbiMarkdown(item);
  if (item.type) {
    const props=['---',`type: ${item.type}`,`order: ${item.order}`,`priority: ${item.priority}`];
    if (!item.status && item.owner) props.push(`assignee: ${yamlQuote(item.owner || '')}`);
    if (item.parent) props.push(`parent: ${yamlQuote(`[[${parentLabel(item)}]]`)}`);
    if (item.status) props.push(`status: ${yamlQuote(item.status)}`,`assignee: ${yamlQuote(item.owner || '')}`,`pe-id: ${item.id}`);
    return [...props,'---','',`# ${item.title}`,'',item.body||'',''].join('\n');
  }
  const foundation=['PRD','Research'].includes(item.kind)?[
    ...(item.kind==='PRD'&&item.visionId?[`pe-vision: ${yamlQuote(item.visionId)}`]:[]),
    ...(Array.isArray(item.jobIds)&&item.jobIds.length?[`pe-jobs: ${JSON.stringify(item.jobIds)}`]:[])
  ]:[];
  if (item.kind==='Akteur'&&Object.hasOwn(actorTypes,item.actorType)) foundation.push(`pe-actor-type: ${item.actorType}`);
  if (vaultRefProperty(item)) foundation.push(vaultRefProperty(item));
  const modelText=item.kind==='Entität'?modelNoteMarkdown(item,foundation):'';

}

function shortHash(value) {
  let hash=2166136261;
  for (let i=0;i<value.length;i++) hash=Math.imul(hash^value.charCodeAt(i),16777619);
  return (hash>>>0).toString(16).padStart(8,'0').slice(0,7);
}

  const record={sha:shortHash(`${p.id}:${item.id}:${list.length}:${contents}`),message,author:seeded?(item.owner||'Produktteam'):(p.team[0]?.name||'Produktteam'),stamp,contents,rev:item.rev||0};

}

function diffMarkdown(before,after) {
  if(before===after) return 'Keine Änderungen an dieser Notiz.';
  const left=before?before.split('\n'):[],right=after?after.split('\n'):[];
  let start=0,end=0;
  while(start<left.length&&start<right.length&&left[start]===right[start]) start++;
  while(end<left.length-start&&end<right.length-start&&left.at(-1-end)===right.at(-1-end)) end++;
  return [`@@ Zeile ${start+1} @@`,...left.slice(start,left.length-end).map(x=>`- ${x}`),...right.slice(start,right.length-end).map(x=>`+ ${x}`)].join('\n');
}

function gitPanel(item,selected='') {

  const head=history[0];
  const index=history.findIndex(commit=>commit.sha===selected);
  const target=history[index];
  const previous=target?history[index+1]:head;
  const before=previous?.contents || '';
  const after=target?.contents ?? itemMarkdown(item);
  const modified=workingChanges(item);
  const workStatus=!head?'Noch ohne Commit':modified?'Geändert':'Unverändert';
  const work=`<button type="button" class="git-choice git-working-choice" data-action="git-select" data-id="${e(item.id+':')}" aria-label="Arbeitsstand vergleichen" aria-pressed="${!target}">
    <span class="git-marker">${icon('file')}</span><span class="git-choice-copy"><strong>Arbeitsstand</strong><small class="${modified?'has-changes':''}">${workStatus}</small></span></button>`;
  const commits=history.map((entry,i)=>`<li><button type="button" class="git-choice" data-action="git-select" data-id="${e(item.id+':'+entry.sha)}" aria-pressed="${entry===target}">
    <span class="git-marker">${icon('git')}</span><span class="git-choice-copy"><strong>${e(entry.message)}</strong>
    <small>${e(entry.author)} · ${e(entry.stamp)}</small><span class="git-meta"><code>${e(entry.sha)}</code>${i===0?'<span>Letzter Commit</span>':''}</span></span></button></li>`).join('');
  const diff=before===after
    ? `<div class="git-identical">${icon('checkCircle')}<div><strong>Keine Unterschiede</strong><p>${target?'Die beiden Stände haben denselben Inhalt.':'Der Arbeitsstand entspricht dem letzten Commit.'}</p></div></div>`
    : `<pre class="git-diff" tabindex="0" aria-label="Geänderte Zeilen">${diffMarkdown(before,after).split('\n').map(line=>`<span class="${line.startsWith('+')?'diff-add':line.startsWith('-')?'diff-del':'diff-location'}">${e(line)}</span>`).join('')}</pre>`;
  const filename=project().folder+'/'+item.id+'.md';
  return `<div class="artifact-history" data-git-panel>
    <div class="git-file-head"><div class="git-file-id"><span class="git-file-icon">${icon('file')}</span><div><strong>${e(item.title)}</strong><span class="git-path">${e(filename)}</span></div></div>
      ${btn('Commit erstellen','git-commit',{id:item.id,symbol:'git',style:modified?'primary':'',disabled:!modified,title:modified?'Geänderten Arbeitsstand festschreiben':'Der Arbeitsstand ist bereits festgeschrieben'})}</div>
    <div class="git-workbench"><section class="git-sidebar" aria-label="Versionsauswahl"><h3>Versionsverlauf <span>${history.length}</span></h3>${work}
      ${commits?`<ol class="git-timeline">${commits}</ol>`:'<p class="git-no-commits">Noch keine Commits</p>'}</section>
      <section class="git-compare" aria-label="Versionsvergleich"><h3>${target?'Änderungen im Commit':'Vergleich des Arbeitsstands'}</h3>
        <div class="git-range"><span>${previous?`<code>${e(previous.sha)}</code>`:'Neue Datei'}</span>${icon('chevron')}<span>${target?`<code>${e(target.sha)}</code>`:'Arbeitsstand'}</span></div>${diff}</section></div>
    <small class="git-simulation">${icon('git')} Simulierte Git-Historie</small></div>`;
}

function populateLegacyGates() {
  const active=state.active;

          const reached=phase==='ready'||r.status==='Abgenommen';

          r.gateEvidence[phase]=(recorded||definitionRows(r,phase)).map(({id,title,type})=>({
            id,title,type,ok:null,detail:phase==='ready'?'Freigabestatus übernommen. Einzelbeleg fehlt.':'Abnahmestatus übernommen. Einzelbeleg fehlt.'

    Object.assign(item,patch);
  } else {
    const item={...patch,id:nextWorkId(vals.kind),type:vals.kind,parent:pbi.id};
    item.order=rankedPosition(backlogItems(),item,children(pbi.id).at(-1)?.id||pbi.id,'after');
    project().work.push(item);
    ui.collapsed.delete(pbi.id);
  }
  hideDialog();
  if (ui.route==='usecase'&&ui.id===pbi.id) ui.pbiTab='Begleititems';
  flash(vals.id?'Begleititem aktualisiert':`${vals.kind} erfasst`);
  if (ui.route==='backlog' && ui.backlogView==='Board') {
    $('workspace').querySelector(`[data-action="backlog-new"][data-id="${CSS.escape(pbi.id)}"]`)?.focus({preventScroll:true});
  }
}

function requestDefinitions(r) { return r.snapshot?.definitions || project().definitions; }

function manualGateVersion(r,phase,rule) {
  const p=project();
  const scope=[p.id,r.id,r.rev,rule.id,rule.title];
  if (phase==='done') return JSON.stringify([...scope,r.commit,r.pr,r.run]);
  const u=getUseCase(r.uc);
  const sources=u?[u,...requestDocuments(u)].map(item=>[item.id,item.rev,gitHead(item.id)?.sha,workingChanges(item)]):[];
  return JSON.stringify([...scope,r.title,r.scope,p.repo,p.branch,p.dataClass,sources]);
}

function setManualGateCheck(r,phase,id,checked) {
  if (!Object.hasOwn(phases,phase)||!gateEditable(r,phase)) return false;
  const rule=requestDefinitions(r)[phase].find(item=>item.id===id&&item.enabled&&item.type==='manual');
  if (!rule) return false;
  if (checked) r.gateChecks[id]=manualGateVersion(r,phase,rule);
  else delete r.gateChecks[id];
  return true;
}

function workInGateScope(r,phase) {
  const current=workFor(r.uc).map(item=>item.id);
  const ids=phase==='done'?[...new Set([...(r.snapshot?.workIds||[]),...current])]:current;
  return ids.map(id=>getWork(id)||{id,missing:true,status:'Fehlt'});
}

function definitionRows(r,phase) {
  const historical=r.gateEvidence?.[phase];
  if (historical) return historical;
  const u=getUseCase(r.uc);
  let standard;
  if (phase==='ready') {
    const missing=gaps(u);
    const gitGaps=requestGitGaps(u);
    standard=[
      {id:'base-ready',title:'Use-Case ist freigegeben und Pflichtartefakte sind vorhanden',ok:!missing.length,detail:missing.join(' · ') || 'Artefakte und Akzeptanzkriterien vorhanden.'},
      {id:'base-git',title:'Git-Stände sind festgeschrieben',ok:!!u&&!gitGaps.length,detail:u?gitGaps.length?`Commit fehlt für ${gitGaps.map(item=>item.id).join(', ')}.`:'Commit-Referenzen vorhanden.':'PBI auswählen.'}
    ];
  } else {
    const superseded=stale(r);
    const criteria=r.snapshot?.useCase.criteria??[];
    const confirmed=criteria.filter(c=>r.checks.includes(c.id)).length;
    const proof=!r.commit?'Prüf-Commit steht aus.':superseded?`Prüf-Commit ${r.commit} gehört zu einem älteren Artefaktstand.`:r.technical?`Prüf-Commit ${r.commit} technisch freigegeben.`:`Technische Freigabe für ${r.commit} steht aus.`;
    standard=[
      {id:'base-done',title:'CI-Nachweis und technische Freigabe liegen vor',ok:!!(r.commit&&r.technical&&!superseded),detail:proof},
      {id:'base-review',title:'Akzeptanzkriterien sind fachlich bestätigt',ok:!!criteria.length&&confirmed===criteria.length,detail:`${confirmed} von ${criteria.length} bestätigt.`}
    ];
  }
  const custom=requestDefinitions(r)[phase].filter(rule=>rule.enabled).map(rule=>{
    if (rule.type==='manual') {
      const recorded=r.gateChecks?.[rule.id];
      const ok=recorded===manualGateVersion(r,phase,rule);
      return {...rule,ok,detail:ok?'Für den aktuellen Prüfstand bestätigt.':recorded?'Prüfstand geändert. Erneut bestätigen.':'Bestätigung ausstehend.'};
    }
    if (rule.type==='scope') {
      const scope=r.snapshot?.scope||r.scope;
      return {...rule,ok:!!scope?.trim(),detail:scope||'Scope fehlt.'};
    }
    const type=openTypes[rule.type];
    const items=workInGateScope(r,phase).filter(item=>item.missing||!type||item.type===type);
    const blockers=items.filter(item=>item.status!=='Erledigt').map(({id,title,status,missing})=>({id,title,status,missing}));
    return {...rule,ok:!blockers.length,blockers,checkedItems:items.map(({id,status})=>({id,status})),detail:blockers.length?'Begleititems benötigen eine Klärung.':`${items.length} geprüft · Keine offenen Einträge.`};
  });
  return [...standard,...custom];
}

function gateEditable(r,phase) { return phase==='ready'?r.status==='Entwurf':r.status==='In Review'&&!!r.snapshot&&!!r.commit&&!stale(r); }
function readyForRelease(r) { return r.status==='Entwurf'&&!r.snapshot&&definitionRows(r,'ready').every(row=>row.ok===true); }
function doneForAcceptance(r) { return gateEditable(r,'done')&&definitionRows(r,'done').every(row=>row.ok===true); }
function canDispatch(r) { return r?.status==='Freigegeben'&&!!r.snapshot&&!stale(r); }

function canStartFollowup(r) {
  if (!r?.snapshot||!getUseCase(r.uc)) return false;
  return r.status==='Änderung angefragt'||(['Freigegeben','In Review','Abgenommen','Fehlgeschlagen','Rückfrage'].includes(r.status)&&stale(r));
}

function gateProgress(rows) {
  const count=rows.filter(row=>row.ok===true).length;
  const unknown=rows.filter(row=>row.ok===null).length;
  return {count,unknown,label:unknown?'Altstand':`${count}/${rows.length} erfüllt`,style:unknown?'info':count===rows.length?'good':'warn'};
}

function gatePanel(r,phase,extra='',folded=false) {
  const rows=definitionRows(r,phase);
  const editable=gateEditable(r,phase);
  const confirmed=r.gateEvidence?.[phase];
  const progress=gateProgress(rows);
  const entries=rows.map(row=>{
    const manual=row.type==='manual'&&editable;
    const controlId=`gate-${phase}-${row.id}`;
    const control=manual?`<input id="${e(controlId)}" type="checkbox" data-change="gate-check" data-phase="${phase}" data-id="${e(row.id)}"${row.ok?' checked':''}>`:`<span class="${row.ok?'gate-ok':row.ok===null?'muted':'gate-open'}">${icon(row.ok?'checkCircle':row.ok===null?'info':'clock')}</span>`;
    const name=manual?`<label for="${e(controlId)}"><strong>${e(row.title)}</strong></label>`:`<strong>${e(row.title)}</strong>`;
    const blockers=row.blockers?.length&&!confirmed?`<div class="gate-blockers">${row.blockers.map(item=>item.missing?`<p>${e(item.id)} · Begleititem fehlt</p>`:link(`${item.id} · ${item.title}`,'edit-work',item.id)).join('')}</div>`:'';
    let repair='';
    if (editable&&row.ok===false&&phase==='ready') {
      const u=getUseCase(r.uc);
      if (row.id==='base-ready'&&u) repair=link('Use-Case öffnen','open-uc',u.id);
      if (row.id==='base-git'&&u) repair=requestGitGaps(u).map(item=>link(`${item.id} · Git-Stand prüfen`,'item-git',item.id,'git')).join('');
    }
    return `<div class="gate-line">${control}<div>${name}<p class="muted">${e(row.detail)}</p>${blockers}${repair?`<div class="gate-blockers">${repair}</div>`:''}</div>${badge(row.ok?'Erfüllt':row.ok===null?'Ohne Einzelbeleg':'Offen',row.ok?'good':row.ok===null?'info':'warn')}</div>`;
  }).join('');
  const version=`<span class="gate-version">Regelstand ${e(requestDefinitions(r).version)}</span>`;

  const reviewScope=phase==='done'&&r.snapshot?.workIds&&requestDefinitions(r).done.some(rule=>rule.enabled&&rule.type.startsWith('open-'))?' Die Prüfung umfasst Begleititems aus der Freigabe und aktuell verknüpfte Begleititems.':'';
  const evidence=progress.unknown?' Historische Entscheidung ohne Einzelbelege.':confirmed?' Nachweis festgehalten.':'';
  const content=`<p class="muted">${phase==='ready'?'Voraussetzungen für die Paketfreigabe.':'Voraussetzungen für die fachliche Abnahme.'}${reviewScope}${evidence}</p><div class="gate-rows">${entries}</div>${extra}`;
  const summary=badge(progress.label,progress.style);
  if (folded) return `<details class="panel delivery-fold"><summary>${icon('chevron')}${e(phases[phase])} ${version}${summary}</summary><div class="panel-in">${content}</div></details>`;
  return panel(content,phases[phase],`<span class="inline wrap">${version}${summary}</span>`);
}

function definitionSettings() {
  const definitions=project().definitions;
  return `<p class="muted">Regelstand ${definitions.version}. Die Paketfreigabe hält die aktiven Kriterien für den Request fest. Die Regel „Keine offenen Begleititems“ umfasst auch offene Fragen am PBI. Die Bug-Prüfung berücksichtigt ausschließlich Bugs.</p><div class="stack space-top">${Object.entries(phases).map(([phase,label])=>{
    const rows=definitions[phase].map(rule=>`<div class="gate-setting-row between"><div><strong>${e(rule.title)}</strong><small class="row-meta">${e(checksByType.find(([value])=>value===rule.type)?.[1])}</small></div><div class="inline wrap">${badge(rule.enabled?'Aktiv':'Inaktiv',rule.enabled?'good':'')}${btn('Bearbeiten','definition-edit',{id:`${phase}:${rule.id}`,style:'small',symbol:'edit'})}</div></div>`).join('');
    const baseline=phase==='ready'?'Grundprüfung: Artefakte, Akzeptanzkriterien und Git-Stände.':'Grundprüfung: CI, technische Freigabe und fachlich bestätigte Akzeptanzkriterien.';
    return panel(`<p class="muted">${baseline}</p><div class="gate-rows">${rows||empty('Für dieses Gate sind nur die Grundprüfungen aktiv.')}</div>`,label,btn('Kriterium hinzufügen','definition-edit',{id:phase,style:'small',symbol:'add'}));
  }).join('')}</div>`;
}

function definitionForm(key) {
  const [phase,id='']=key.split(':');
  if (!Object.hasOwn(phases,phase)) return;
  const rule=project().definitions[phase].find(item=>item.id===id);
  const fields=`<input type="hidden" name="phase" value="${phase}"><input type="hidden" name="id" value="${e(id)}">`+
    input('title','Kriterium',rule?.title||'','required autofocus maxlength="130"')+choose('type','Prüfung',checksByType,rule?.type||'manual')+choose('enabled','Anwendung',[['yes','Aktiv'],['no','Inaktiv']],rule&&!rule.enabled?'no':'yes');
  showDialog(`${phases[phase]} · Kriterium ${rule?'bearbeiten':'hinzufügen'}`,form('definition-rule',fields,'Kriterium speichern'));
}

function saveDefinition(vals) {
  if (!Object.hasOwn(phases,vals.phase) || !checksByType.some(([id])=>id===vals.type)) return;
  const config=project().definitions;
  const current=config[vals.phase].find(x=>x.id===vals.id);
  const sameCheck=current?.type===vals.type && current.title===vals.title && current.enabled===(vals.enabled==='yes');
  if (sameCheck) { hideDialog(); return; }
  const data={title:vals.title,type:vals.type,enabled:vals.enabled==='yes'};
  if (current) {
    Object.assign(current,data);
    if (vals.phase==='ready') project().requests.filter(r=>r.status==='Entwurf').forEach(r=>delete r.gateChecks[current.id]);
  } else config[vals.phase].push({id:`RULE-${config.nextRule++}`,...data});
  config.version++;
  hideDialog(); flash(`${phases[vals.phase]} aktualisiert`);
}

function saveStoryWork(map,vals) {
  const card=map.cards.find(story=>story.id===vals.cardId);
  if (!card||!workTypes.includes(vals.kind)||!workStatuses.includes(vals.status)||!priorityOptions.some(([key])=>key===vals.priority)) return;
  const {attached,related,parents}=storyWorkScope(card);
  const existing=[...attached,...related].find(item=>item.id===vals.id);
  if (vals.id&&(!existing||existing.type!==vals.kind)) return;
  if (existing?.parent?vals.pbi!==existing.parent:vals.pbi!=='story'&&!parents.some(parent=>parent.id===vals.pbi)) return;
  const item=existing||{id:nextWorkId(vals.kind),type:vals.kind};
  Object.assign(item,{title:vals.title,body:vals.body,owner:vals.owner,status:vals.status,priority:vals.priority});
  if (vals.pbi==='story') {
    if (!existing) (card.workItems||=[]).push(item);
  } else if (!item.parent) {
    item.parent=vals.pbi;
    item.order=rankedPosition(backlogItems(),item,children(item.parent).at(-1)?.id||item.parent,'after');
    project().work.push(item);
    if (existing) card.workItems=card.workItems.filter(record=>record!==item);
    card.links.push({projectId:project().id,itemId:item.id});
    ui.collapsed.delete(item.parent);
  }
  const position=document.querySelector('.sm-scroll')?.scrollLeft||0;
  hideDialog();
  refresh();
  const region=document.querySelector('.sm-scroll');
  if (region) region.scrollLeft=position;
  $(`story-card-${card.id}`)?.querySelector('[data-action="sm-work"]')?.focus({preventScroll:true});
  storyWorkManager(card,item.id);
  toast(existing?'Begleititem aktualisiert':`${item.type} erfasst`);
}

function storyCard(card,index,length) {
  const links=card.links.length?`<ul class="sm-card-links" aria-label="Verknüpfte Backlog-Items">${card.links.map(storyLinkRow).join('')}</ul>`:'<p class="sm-card-unlinked">Ohne Backlog-Link</p>';
  const options=btn('Story bearbeiten','sm-card',{id:card.id,style:'small quiet',symbol:'edit'})+
    btn('Backlog-Item verknüpfen','sm-link',{id:card.id,style:'small quiet',symbol:'link'})+
    card.links.map(ref=>btn(`Link zu ${ref.itemId} lösen`,'sm-unlink',{id:`${card.id}:${ref.itemId}`,style:'small quiet',symbol:'cross'})).join('')+
    storyMoveButtons('card',card.id,index,length,true);
  const label=`Details und Aktionen für Story „${card.title}“`;
  return `<article class="sm-card sm-node" id="story-card-${e(card.id)}" tabindex="-1" aria-labelledby="story-title-${e(card.id)}"><details class="sm-card-details"><summary aria-label="${e(label)}" title="${e(label)}"><h3 id="story-title-${e(card.id)}">${e(card.title)}</h3>${icon('down')}</summary>${card.description?`<p class="sm-card-description">${e(card.description)}</p>`:''}<div class="sm-tool-list">${options}</div></details>${links}${storyWorkButton(card)}</article>`;
}

function storyBand(map,slice,steps,sliceIndex) {
  const titleText=slice?.title||'Ohne Lieferabschnitt';
  const sliceId=slice?.id||unslicedStoryKey;
  const move=(direction,name,symbol,disabled)=>`<button type="button" class="icon-button" aria-label="${name}" title="${name}" data-action="sm-position" data-id="slice:${e(sliceId)}:${direction}"${disabled?' disabled':''}>${icon(symbol)}</button>`;
  const order=slice&&map.slices.length>1?`<span class="sm-slice-order" role="group" aria-label="Lieferabschnitt einordnen">${move('up','Höher einordnen','up',sliceIndex===0)}${move('down','Tiefer einordnen','down',sliceIndex===map.slices.length-1)}</span>`:'';
  const actions=slice?`<div class="sm-slice-actions">${btn('Fürs Backlog prüfen','sm-review',{id:`${map.id}:${slice.id}`,symbol:'backlog',style:'small sm-review-link'})}${btn('Bearbeiten','sm-slice',{id:slice.id,symbol:'edit',style:'small quiet',title:'Lieferabschnitt bearbeiten'})}${order}</div>`:'';
  let count=0;
  const cells=steps.map(step=>{
    const cards=storyCell(map,step.id,sliceId);
    count+=cards.length;
    return `<div class="sm-cell${step.id?'':' sm-cell-placeholder'}" aria-label="${e(step.title)}"><div class="sm-mobile-step"><span>${e(step.activityTitle)}</span><strong>${e(step.title)}</strong></div>${cards.map((card,i)=>storyCard(card,i,cards.length)).join('')}${step.id?iconBtn(`Story für „${step.title}“ in „${titleText}“ hinzufügen`,'sm-card','add',`${step.id}:${sliceId}`,false,'sm-add-card'):''}</div>`;
  }).join('');
  return `<section class="sm-band${slice?'':' sm-unscheduled'}" aria-label="${e(titleText)}">
    <header class="sm-slice-label" id="story-node-${e(sliceId)}" tabindex="-1"><div class="sm-slice-inner">
      <div class="sm-slice-copy"><h3>${e(titleText)}</h3>${slice?.outcome?`<p><span class="sm-outcome-label">Ziel:</span> ${e(slice.outcome)}</p>`:''}</div>${actions}
    </div></header><div class="sm-band-count">${count} ${count===1?'Story':'Storys'}</div>${cells}</section>`;
}

function storyBackbone(map) {
  return `<section class="sm-backbone" aria-label="Aktivitäten und Nutzerschritte"><div class="sm-axis-label"><span>Aktivitäten ${icon('chevron')}</span><span>Nutzerschritte ${icon('chevron')}</span></div><div class="sm-activities">${map.activities.map((activity,i)=>{
    const steps=activity.steps.map((step,k)=>`<div class="sm-step sm-node" id="story-node-${e(step.id)}" tabindex="-1"><h4>${e(step.title)}</h4>${storyTools('Aktionen für Nutzerschritt „'+step.title+'“',btn('Schritt bearbeiten','sm-step',{id:`${activity.id}:${step.id}`,style:'small quiet',symbol:'edit'})+storyMoveButtons('step',step.id,k,activity.steps.length))}</div>`).join('');
    const options=btn('Aktivität bearbeiten','sm-activity',{id:activity.id,symbol:'edit',style:'small quiet'})+
      btn('Schritt hinzufügen','sm-step',{id:activity.id,symbol:'add',style:'small quiet'})+storyMoveButtons('activity',activity.id,i,map.activities.length);
    return `<div class="sm-activity" style="--activity-cols:${Math.max(activity.steps.length,1)}"><div class="sm-activity-title sm-node" id="story-node-${e(activity.id)}" tabindex="-1"><h3>${e(activity.title)}</h3>${storyTools('Aktionen für Aktivität „'+activity.title+'“',options)}</div><div class="sm-steps">${steps||btn('Ersten Schritt hinzufügen','sm-step',{id:activity.id,symbol:'add',style:'small quiet'})}</div></div>`;
  }).join('')}</div></section>`;
}

function mapFoundationPaths(map) {
  return Array.isArray(map?.foundationRefs)?map.foundationRefs:[];
}

function mapFoundationLinks(map) {
  const docLinks=[map.prdId,...(map.jobIds||[])].filter(Boolean).map(id=>{
    const doc=getDoc(id);
    return doc?link(`${doc.id} · ${doc.title}`,'open-doc',doc.id,kindIcon[doc.kind]):`<span class="muted">${e(id)} · Verweis nicht verfügbar</span>`;
  });
  const files=mapFoundationPaths(map).map(path=>{
    const entry=vaultResolve(path);
    return link(entry?.id?`${entry.id} · ${entry.title}`:entry?.title||vaultCleanPath(path),'vault-ref-open',path,entry?.kind==='image'?'proto':'file');
  });
  return [...docLinks,...files].join('');
}

let expandedMapContext=null;

function mapContextSections(map) {
  return [
    {key:'foundations',label:'Grundlagen',icon:'book',count:[map.prdId,...(map.jobIds||[]),...mapFoundationPaths(map)].filter(Boolean).length,content:()=>mapFoundationsHeader(map)},
    {key:'prototypes',label:'Prototypen',icon:'proto',count:prototypesForSource('map',map.id).length,content:()=>sourcePrototypeStrip('map',map.id)},
    {key:'nfrs',label:'NFRs',icon:'checkCircle',count:directNfrs('map',map.id).length,content:()=>nfrSourceSection('map',map.id)},
    {key:'entities',label:'Entitäten',icon:'domain',count:entitiesLinkedToTarget('map',map.id).length,content:()=>entityScopeSection('map',map.id)}
  ];
}

function mapContextBar(map) {
  const sections=mapContextSections(map);
  const active=expandedMapContext?.projectId===project().id&&expandedMapContext.mapId===map.id?expandedMapContext.key:'';
  const buttons=sections.map(part=>`<button type="button" class="map-context-trigger" data-action="sm-context" data-id="${part.key}" aria-expanded="${part.key===active}" aria-controls="map-context-${part.key}" aria-label="${part.label} ${part.count}">
    ${icon(part.icon)}<span>${part.label}</span><span class="map-context-count">${part.count}</span>${icon('down')}</button>`).join('');
  const panels=sections.map(part=>`<div class="map-context-panel" id="map-context-${part.key}"${part.key===active?'':' hidden'}>${part.key===active?part.content():''}</div>`).join('');
  return `<div class="map-context"><div class="map-context-controls" role="group" aria-label="Map-Kontext">${buttons}</div>${panels}</div>`;
}

function toggleMapContext(map,key) {
  const context=$('workspace').querySelector('.map-context');
  const selector=`[data-action="sm-context"][data-id="${CSS.escape(key)}"]`;
  const trigger=context?.querySelector(selector);
  if(!trigger)return;
  expandedMapContext=trigger.getAttribute('aria-expanded')==='true'?null:{projectId:project().id,mapId:map.id,key};
  context.outerHTML=mapContextBar(map);
  $('workspace').querySelector(selector)?.focus({preventScroll:true});
}

function syncMapContextCounts(event) {
  if(!['sm-foundations','prototype-brief','nfr-source-assign','entity-scope-assign'].includes(event.target.dataset.form))return;
  const controls=$('workspace').querySelector('.map-context-controls'),map=currentStoryMap();
  if(!controls||!map)return;
  for(const {key,label,count} of mapContextSections(map)){
    const button=controls.querySelector(`[data-id="${key}"]`);
    button.querySelector('.map-context-count').textContent=count;
    button.setAttribute('aria-label',label+' '+count);
  }
}

function mapFoundationsHeader(map) {
  return `<section class="map-foundations" aria-label="Grundlagen"><h2>Grundlagen</h2><div class="map-foundation-links">${mapFoundationLinks(map)||'<span class="muted">Noch nicht zugeordnet</span>'}</div>${btn('Grundlagen bearbeiten','sm-foundations',{symbol:'edit',style:'small quiet'})}</section>`;
}

function mapFoundationRow(path) {
  const entry=vaultResolve(path),plainPath=vaultCleanPath(path);
  return `<li>${storyHidden('foundationRefs',path)}<span><strong>${e(entry?.title||plainPath)}</strong>${entry?.title!==plainPath?`<small>${e(plainPath)}</small>`:''}</span>${iconBtn(`Verweis auf ${plainPath} entfernen`,'sm-foundation-remove','cross',path)}</li>`;
}

function mapFoundationForm(map) {
  const docs=project().docs;
  const prds=docs.filter(d=>d.kind==='PRD').map(d=>[d.id,`${d.id} · ${d.title}`]);
  const prdId=map.prdId||'',jobIds=map.jobIds||[];
  if (prdId&&!prds.some(([id])=>id===prdId)) prds.push([prdId,prdId+' · Verweis nicht verfügbar']);
  const jobs=docs.filter(d=>d.kind==='JTBD').map(d=>[d.id,d.title]);
  for (const id of jobIds) if (!jobs.some(([key])=>key===id)) jobs.push([id,'Verweis nicht verfügbar']);
  const choices=jobs.map(([id,title])=>`<label class="check"><input type="checkbox" name="jobIds" value="${e(id)}"${jobIds.includes(id)?' checked':''}><span>${e(title)} <small>${e(id)}</small></span></label>`).join('');
  const fields=storyHidden('sourceProject',project().id)+storyHidden('mapId',map.id)+
    choose('prdId','PRD',[['','Ohne Zuordnung'],...prds],prdId)+
    `<fieldset class="foundation-jobs"><legend>Jobs to Be Done</legend>${choices||'<p class="muted">In diesem Projekt gibt es noch keine Jobs.</p>'}</fieldset>
    <fieldset class="foundation-jobs"><legend>Weitere Quellen</legend><ul class="map-foundation-list">${mapFoundationPaths(map).map(mapFoundationRow).join('')}</ul>${btn('Verweis hinzufügen','sm-foundation-pick',{symbol:'add',style:'small'})}</fieldset>`;
  showDialog('Grundlagen bearbeiten',form('sm-foundations',fields,'Grundlagen speichern'));
}

function pickMapFoundation(map) {
  const el=$('dialog').querySelector('form[data-form="sm-foundations"]');
  if (!el) return;
  chooseVaultReference(entry=>{
    if (!el.isConnected||map!==currentStoryMap()||el.elements.sourceProject.value!==project().id) return;
    const doc=entry.kind==='doc'?getDoc(entry.id):null;
    if (doc?.kind==='PRD') el.elements.prdId.value=doc.id;
    else if (doc?.kind==='JTBD') el.querySelector(`[name="jobIds"][value="${CSS.escape(doc.id)}"]`).checked=true;
    else {
      const path=vaultCleanPath(entry.path);
      const paths=new FormData(el).getAll('foundationRefs');
      if (!paths.some(other=>vaultCleanPath(other)===path)) {
        const qualified=path.includes('/')?path:'./'+path;
        el.querySelector('.map-foundation-list').insertAdjacentHTML('beforeend',mapFoundationRow(qualified));
      } else toast('Der Verweis ist bereits ausgewählt.');
    }
    el.querySelector('[data-action="sm-foundation-pick"]').focus();
  },{allowEmbed:false});
}

function saveMapFoundations(el) {
  const map=currentStoryMap();
  const data=new FormData(el),prdId=data.get('prdId')||'';
  const jobIds=[...new Set(data.getAll('jobIds'))],paths=[...new Set(data.getAll('foundationRefs'))];
  if (!map||data.get('sourceProject')!==project().id||data.get('mapId')!==map.id) return;
  if (prdId && prdId!==map.prdId && getDoc(prdId)?.kind!=='PRD') return;
  if (jobIds.some(id=>!(map.jobIds||[]).includes(id)&&getDoc(id)?.kind!=='JTBD')) return;
  if (paths.some(path=>!mapFoundationPaths(map).includes(path)&&!vaultResolve(path))) return;
  map.prdId=prdId;map.jobIds=jobIds;
  if (paths.length) map.foundationRefs=paths; else delete map.foundationRefs;
  storyRefresh('Grundlagen gespeichert');
  $('workspace').querySelector('[data-action="sm-foundations"]')?.focus({preventScroll:true});
}

function storyMapView() {
  const map=currentStoryMap();
  if(!map)return missing('Story Maps','storymaps');
  const slice=reviewedSlice(map);
  if(slice)return storySliceReview(map,slice);
  const steps=storySteps(map);
  const actions=btn('Aktivität hinzufügen','sm-activity',{style:map.activities.length?'':'primary',symbol:'add'})+btn('Lieferabschnitt hinzufügen','sm-slice',{symbol:'add'});
  const header=`<div class="sm-map-heading">${title(map.title,map.goal,'',crumbs([['Story Maps','go','storymaps'],map.id]))}
    <div class="sm-map-meta"><p class="sm-persona">${icon('people')}<span>Zielgruppe</span> <strong>${e(map.persona)}</strong></p><button type="button" class="btn small quiet map-edit-toggle" data-action="sm-edit" data-id="" aria-label="Map bearbeiten" title="Map bearbeiten">${icon('edit')}<span>Map bearbeiten</span></button></div>
    ${mapContextBar(map)}</div>`;
  const toolbar=`<div class="section-head between sm-map-bar"><h2>Nutzerablauf</h2><div class="inline wrap">${actions}</div></div>`;
  if(!map.activities.length)return header+toolbar+panel('<p>Lege die erste Aktivität an. Ihre Nutzerschritte bilden die Spalten für deine Storys.</p>');
  const columns=map.activities.reduce((total,activity)=>total+Math.max(activity.steps.length,1),0);
  const placedSteps=map.activities.flatMap(activity=>activity.steps.length?activity.steps.map(step=>({...step,activityTitle:activity.title})):[{id:'',title:'Nutzerschritt fehlt',activityTitle:activity.title}]);
  const releaseAxis=`<div class="sm-release-axis"><span>Lieferabschnitte ${icon('down')}</span><span>Storys je Nutzerschritt</span></div>`;
  return header+toolbar+`<div class="sm-scroll" tabindex="0" role="region" aria-label="Story Map mit Aktivitäten, Nutzerschritten und Lieferabschnitten" style="--map-cols:${columns}"><div class="sm-board">${storyBackbone(map)}${steps.length?releaseAxis+map.slices.map((slice,i)=>storyBand(map,slice,placedSteps,i)).join('')+storyBand(map,null,placedSteps,-1):''}</div></div>`;
}

const storyHidden=(name,value)=>`<input type="hidden" name="${name}" value="${e(value||'')}">`;

function storyMapForm(map,prd=null) {
  const jobs=foundationJobs(prd);
  const vision=getDoc(prd?.visionId);
  const group=vision?.kind==='Vision'?sectionValue(vision.body,/^##\s+Zielgruppe\s*$/i):'';
  const outcome=prd?(sectionValue(prd.body,/^##\s+.*Ergebnis\s*$/i)||(jobs.length===1?sectionValue(jobs[0].body,/^##\s+Angestrebter Fortschritt\s*$/i):'')):'';
  const source=prd?`<p class="foundation-origin">Aus dem PRD <strong>${e(prd.title)}</strong> · ${e(prd.id)}</p>${storyHidden('prdId',prd.id)}`:'';
  const fields=source+storyHidden('sourceProject',project().id)+storyHidden('id',map?.id)+input('title','Name der Story Map',map?.title??prd?.title??'','required autofocus maxlength="100"')+
    input('persona','Zielgruppe',map?.persona??group.slice(0,100),'required maxlength="100"')+area('goal','Nutzerziel',map?.goal??outcome.slice(0,300),'required maxlength="300"');
  showDialog(map?'Story Map bearbeiten':'Story Map erstellen',form('sm-map',fields,map?'Änderungen speichern':'Story Map erstellen'));
}

function storyNodeForm(map,key,id) {
  const [parent,stepId='']=id.split(':');
  const activity=map.activities.find(item=>item.id===parent);
  const record=key==='sm-activity'?activity:key==='sm-step'?activity?.steps.find(step=>step.id===stepId):map.slices.find(slice=>slice.id===id);
  const label=key==='sm-activity'?'Aktivität':key==='sm-step'?'Nutzerschritt':'Lieferabschnitt';
  if(key==='sm-step'&&!activity)return;
  const fields=storyHidden('id',record?.id)+(key==='sm-step'?storyHidden('activityId',parent):'')+input('title','Titel',record?.title||'','required autofocus maxlength="100"')+(key==='sm-slice'?area('outcome','Nutzerergebnis',record?.outcome||'','maxlength="300"'):'');
  showDialog(`${label} ${record?'bearbeiten':'hinzufügen'}`,form(key,fields,record?'Änderungen speichern':'Hinzufügen'));
}

function storyCardForm(map,id) {
  const [stepId,sliceId]=id.split(':');
  const current=map.cards.find(card=>card.id===id);
  const steps=storySteps(map);
  if(!steps.length)return;
  const fields=storyHidden('cardId',current?.id)+input('title','Story-Titel',current?.title||'','required autofocus maxlength="110"')+area('description','Bedarf oder erwartetes Ergebnis',current?.description||'','maxlength="500"')+choose('stepId','Nutzerschritt',steps.map(step=>[step.id,`${step.activityTitle} / ${step.title}`]),current?.stepId||stepId,'required')+choose('sliceId','Lieferabschnitt',[[unslicedStoryKey,'Noch ohne Lieferabschnitt'],...map.slices.map(slice=>[slice.id,slice.title])],current?.sliceId||sliceId||unslicedStoryKey,'required');
  showDialog(current?'Story bearbeiten':'Story hinzufügen',form('sm-card',fields,current?'Änderungen speichern':'Story hinzufügen'));
}

function reviewedSlice(map) {
  const [,projectPart,projectId,route,mapId,section,sliceId]=location.hash.split('/');
  if(projectPart!=='project'||route!=='storymap'||section!=='slice'||projectId!==encodeURIComponent(project().id)||mapId!==encodeURIComponent(map.id))return null;
  return map.slices.find(slice=>encodeURIComponent(slice.id)===sliceId);
}

function hasLinkedPbi(card) {
  return card.links.some(ref=>ref.projectId===project().id&&getUseCase(ref.itemId));
}

function sliceReviewCard(card,step) {
  const linked=hasLinkedPbi(card);
  const deferred=!linked&&card.backlogDeferredFor===card.sliceId;
  const refs=card.links.map(ref=>{
    const item=ref.projectId===project().id&&backlogItem(ref.itemId);
    if(!item)return `<li class="muted">${e(ref.itemId)} · Verweis nicht gefunden</li>`;
    const action=item.type==='PBI'?'open-uc':workTypes.includes(item.type)?'edit-work':'backlog-edit';
    const relation=item.type==='PBI'?(ref.source==='created'?'Neu angelegt':'Bestehendes PBI'):'Verknüpftes Item';
    return `<li><span>${e(relation)}${item.type==='PBI'?'':` · ${e(item.type)}`}</span>${link(`${item.id} · ${item.title}`,action,item.id,'link')}</li>`;
  }).join('');
  const actions=deferred?btn('Wieder aufnehmen','sm-resume',{id:card.id,style:'small'}):
    (linked?'':btn('PBI aus Story anlegen','sm-create-pbi',{id:card.id,symbol:'add',style:'small'}))+
    btn('Vorhandenes Item verknüpfen','sm-link',{id:card.id,symbol:'link',style:'small quiet'})+
    (linked?'':btn('Zurückstellen','sm-defer',{id:card.id,style:'small quiet'}));
  return `<article class="handoff-story" data-review-card="${e(card.id)}" tabindex="-1"><p class="handoff-step">${e([step?.activityTitle,step?.title].filter(Boolean).join(' › '))}</p>
    <div class="between"><h2>${e(card.title)}</h2>${badge(linked?'PBI verknüpft':deferred?'Zurückgestellt':'PBI offen',linked?'good':'')}</div>
    ${card.description?`<p>${e(card.description)}</p>`:''}${refs?`<ul class="handoff-links">${refs}</ul>`:''}<div class="inline wrap">${actions}</div></article>`;
}

function storySliceReview(map,slice) {
  const steps=storySteps(map);
  const cards=steps.flatMap(step=>storyCell(map,step.id,slice.id).map(card=>({card,step})));
  const linked=cards.filter(({card})=>hasLinkedPbi(card)).length;
  const deferred=cards.filter(({card})=>!hasLinkedPbi(card)&&card.backlogDeferredFor===slice.id).length;
  const path=crumbs([['Story Maps','go','storymaps'],[map.title,'sm-open',map.id],'Backlog-Prüfung']);
  return title(slice.title,slice.outcome,'',path)+
    `<p class="handoff-summary">${linked} von ${cards.length} Storys mit PBI${deferred?` · ${deferred} zurückgestellt`:''}</p>`+
    (cards.length?`<div class="panel handoff-list">${cards.map(({card,step})=>sliceReviewCard(card,step)).join('')}</div>`:
      panel(`<div class="between"><p>Diesem Lieferabschnitt sind noch keine Storys zugeordnet.</p>${btn('Zur Story Map','sm-open',{id:map.id})}</div>`));
}

function storyPbiForm(map,cardId) {
  const slice=reviewedSlice(map);
  const card=slice&&map.cards.find(entry=>entry.id===cardId&&entry.sliceId===slice.id);
  if(!card||hasLinkedPbi(card)||card.backlogDeferredFor===slice.id)return;
  const features=project().groups.filter(item=>item.type==='Feature');
  const linkedFeature=card.links.find(ref=>ref.projectId===project().id&&features.some(feature=>feature.id===ref.itemId));
  const parent=pbiParentFields(linkedFeature?.itemId);
  const jobs=(map.jobIds||[]).map(getDoc).filter(job=>job?.kind==='JTBD');
  const fields=storyHidden('projectId',project().id)+storyHidden('mapId',map.id)+storyHidden('sliceId',slice.id)+storyHidden('cardId',card.id)+
    input('title','PBI-Titel',card.title,'required autofocus maxlength="110"')+area('body','Bedarf und erwartetes Ergebnis',card.description||'')+parent+
    `<div class="form-grid">${choose('req','PRD-Anforderung',prdOptions(),map.prdId||'')}${choose('job','Job to Be Done',[['','Nicht zugeordnet'],...jobs.map(job=>[job.id,`${job.id} · ${job.title}`])],jobs[0]?.id||'')}
    ${choose('priority','Priorität',priorityOptions,'P2')}${backlogOwnerField('')}</div>`;
  showDialog('PBI aus Story anlegen',form('sm-create-pbi',fields,'PBI anlegen und verknüpfen'));
}

function saveStoryPbi(map,vals) {
  const slice=reviewedSlice(map);
  const card=slice&&map.cards.find(entry=>entry.id===vals.cardId&&entry.sliceId===slice.id);
  if(!card||map.id!==vals.mapId||slice.id!==vals.sliceId||project().id!==vals.projectId||hasLinkedPbi(card)||card.backlogDeferredFor===slice.id)return;
  const item=addBacklogPbi(vals);
  if(!item)return;
  card.links.push({projectId:project().id,itemId:item.id,source:'created'});
  delete card.backlogDeferredFor;
  refreshSliceCard(card,`${item.id} angelegt und verknüpft`);
}

function refreshSliceCard(card,message) {
  hideDialog();
  flash(message);
  $('workspace').querySelector(`[data-review-card="${CSS.escape(card.id)}"]`)?.focus({preventScroll:true});
}

function storyLinkForm(map,cardId) {
  const card=map.cards.find(entry=>entry.id===cardId);
  if(!card)return;
  const candidates=rankItems(backlogItems()).filter(item=>!card.links.some(ref=>ref.projectId===project().id&&ref.itemId===item.id));
  const slice=reviewedSlice(map);
  const origin=slice?storyHidden('sliceId',slice.id)+storyHidden('mapId',map.id)+storyHidden('projectId',project().id):'';
  const fields=origin+storyHidden('cardId',card.id)+choose('itemId','Backlog-Item',[['','Backlog-Item auswählen'],...candidates.map(item=>[item.id,`${item.id} · ${item.type} · ${item.title}`])],'','required autofocus');
  showDialog('Backlog-Item verknüpfen',candidates.length?form('sm-link',fields,'Verknüpfen'):empty('Für diese Story sind keine weiteren Backlog-Items verfügbar.'));
}

function focusStoryElement(id) {
  const element=$(`story-card-${id}`)||$(`story-node-${id}`);
  if(!element)return;
  element.scrollIntoView({block:'nearest',inline:'nearest'});
  element.focus({preventScroll:true});
}

function storyRefresh(message,cardId='') {
  const left=document.querySelector('.sm-scroll')?.scrollLeft||0;
  hideDialog();
  flash(message);
  const region=document.querySelector('.sm-scroll');
  if(region)region.scrollLeft=left;
  if(cardId)focusStoryElement(cardId);
}

function storyReorder(map,command) {
  const [kind,id,direction]=command.split(':');
  if(!['up','down'].includes(direction))return;
  const card=kind==='card'?map.cards.find(item=>item.id===id):null;
  const entries=kind==='activity'?map.activities:kind==='slice'?map.slices:kind==='step'?map.activities.find(activity=>activity.steps.some(step=>step.id===id))?.steps:card?storyCell(map,card.stepId,card.sliceId):null;
  if(!entries)return;
  const current=entries.findIndex(item=>item.id===id);
  const next=current+(direction==='up'?-1:1);
  if(current<0||next<0||next>=entries.length)return;
  if(card){
    const first=map.cards.indexOf(entries[current]);const second=map.cards.indexOf(entries[next]);
    [map.cards[first],map.cards[second]]=[map.cards[second],map.cards[first]];
  }else [entries[current],entries[next]]=[entries[next],entries[current]];
  storyRefresh('Reihenfolge aktualisiert',id);
}

function storyMapAction(key,id='') {
  if(key==='sm-open'){if(projectStoryMaps().some(item=>item.id===id))go('storymap',id);return;}
  if(key==='sm-review'){
    const [mapId,sliceId]=id.split(':');
    if(projectStoryMaps().find(item=>item.id===mapId)?.slices.some(slice=>slice.id===sliceId))go('storymap',mapId,sliceId);
    return;
  }
  if(key==='sm-new'){storyMapForm();return;}
  if(key==='sm-focus'){
    const [mapId,cardId]=id.split(':');
    if(cardId){if(!projectStoryMaps().some(item=>item.id===mapId))return;go('storymap',mapId);}
    focusStoryElement(cardId||mapId);
    return;
  }
  const map=currentStoryMap();
  if(!map)return;
  if (['sm-work','sm-work-new','sm-work-edit'].includes(key)) {
    const [cardId,itemId]=id.split(':');
    const card=map.cards.find(entry=>entry.id===cardId);
    if (!card) return;
    if (key==='sm-work') storyWorkManager(card);
    else storyWorkForm(card,key==='sm-work-edit'?itemId:'');
    return;
  }
  if(key==='sm-foundations')mapFoundationForm(map);
  else if(key==='sm-foundation-pick')pickMapFoundation(map);
  else if(key==='sm-foundation-remove'){
    const el=$('dialog').querySelector('form[data-form="sm-foundations"]');
    el?.querySelector(`[data-action="sm-foundation-remove"][data-id="${CSS.escape(id)}"]`)?.closest('li')?.remove();
    el?.querySelector('[data-action="sm-foundation-pick"]')?.focus();
  }
  else if(key==='sm-context')toggleMapContext(map,id);
  else if(key==='sm-edit')storyMapForm(map);
  else if(['sm-activity','sm-step','sm-slice'].includes(key))storyNodeForm(map,key,id);
  else if(key==='sm-card')storyCardForm(map,id);
  else if(key==='sm-link')storyLinkForm(map,id);
  else if(key==='sm-create-pbi')storyPbiForm(map,id);
  else if(key==='sm-defer'||key==='sm-resume'){
    const slice=reviewedSlice(map);
    const card=slice&&map.cards.find(entry=>entry.id===id&&entry.sliceId===slice.id);
    if(!card||hasLinkedPbi(card))return;
    if(key==='sm-defer')card.backlogDeferredFor=slice.id;
    else delete card.backlogDeferredFor;
    refreshSliceCard(card,key==='sm-defer'?'Story zurückgestellt':'Story wieder aufgenommen');
  }
  else if(key==='sm-position')storyReorder(map,id);
  else if(key==='sm-unlink'){
    const [cardId,itemId]=id.split(':');
    const card=map.cards.find(entry=>entry.id===cardId);
    if(!card||!card.links.some(ref=>ref.itemId===itemId))return;
    card.links=card.links.filter(ref=>ref.itemId!==itemId);
    storyRefresh('Verknüpfung entfernt',card.id);
  }
}

function storyMapSubmit(formName,vals) {
  const map=currentStoryMap();
  if(formName==='sm-map'){
    if(vals.sourceProject!==project().id || (vals.id&&map?.id!==vals.id))return;
    const prd=vals.prdId?getDoc(vals.prdId):null;
    if(vals.prdId&&prd?.kind!=='PRD')return;
    const details={title:vals.title,persona:vals.persona,goal:vals.goal};
    if(vals.id){Object.assign(map,details);storyRefresh('Story Map gespeichert');}
    else{
      const origin=prd?{prdId:prd.id,jobIds:foundationJobs(prd).map(job=>job.id)}:{};
      const created={id:nextId('SM',projectStoryMaps()),...origin,...details,activities:[],slices:[],cards:[]};
      if(!Array.isArray(project().storyMaps))project().storyMaps=[];
      project().storyMaps.push(created);persist();go('storymap',created.id);toast('Story Map angelegt');
    }
    return;
  }
  if(!map)return;
  if(formName==='sm-create-pbi'){saveStoryPbi(map,vals);return;}
  if(formName==='sm-work-save'){saveStoryWork(map,vals);return;}
  if(formName==='sm-link'){
    const card=map.cards.find(entry=>entry.id===vals.cardId);
    if(!card||!backlogItem(vals.itemId)||card.links.some(ref=>ref.projectId===project().id&&ref.itemId===vals.itemId))return;
    if(vals.sliceId&&(!reviewedSlice(map)||card.sliceId!==vals.sliceId||map.id!==vals.mapId||project().id!==vals.projectId))return;
    card.links.push({projectId:project().id,itemId:vals.itemId});
    if(getUseCase(vals.itemId))delete card.backlogDeferredFor;
    if(vals.sliceId){refreshSliceCard(card,`Vorhandener Eintrag ${vals.itemId} verknüpft`);return;}
    storyRefresh('Backlog-Item verknüpft',card.id);
    return;
  }
  if(formName==='sm-card'){
    if(!storySteps(map).some(step=>step.id===vals.stepId)||!(vals.sliceId===unslicedStoryKey||map.slices.some(slice=>slice.id===vals.sliceId)))return;
    const fields={title:vals.title,description:vals.description,stepId:vals.stepId,sliceId:vals.sliceId};
    let card=map.cards.find(entry=>entry.id===vals.cardId);
    if(vals.cardId&&!card)return;
    if(card){
      if(card.stepId!==fields.stepId||card.sliceId!==fields.sliceId){map.cards=map.cards.filter(entry=>entry!==card);map.cards.push(card);}
      Object.assign(card,fields);
    }else {card={id:nextId('CARD',map.cards),...fields,links:[]};map.cards.push(card);}
    storyRefresh('Story gespeichert',card.id);
    return;
  }
  const activity=map.activities.find(entry=>entry.id===vals.activityId);
  const entries=formName==='sm-activity'?map.activities:formName==='sm-slice'?map.slices:formName==='sm-step'?activity?.steps:null;
  if(!entries)return;
  const current=entries.find(item=>item.id===vals.id);
  if(vals.id&&!current)return;
  const fields={title:vals.title};
  if(formName==='sm-slice')fields.outcome=vals.outcome;
  let target=current;
  if(target)Object.assign(target,fields);
  else {
    if(formName==='sm-activity')target={id:nextId('ACT',entries),...fields,steps:[]};
    else if(formName==='sm-slice')target={id:nextId('SL',entries),...fields};
    else target={id:nextId('STEP',storySteps(map)),...fields};
    entries.push(target);
  }
  storyRefresh('Story Map aktualisiert',target.id);
}

function reflectDesktopNavigation() {
  document.querySelector('.layout').classList.toggle('nav-compact',compactDesktopNav);
  const toggle=$('sidebar').querySelector('[data-action="nav-width"]');
  const label=compactDesktopNav?'Seitennavigation ausklappen':'Seitennavigation einklappen';

const compactNavigation = window.matchMedia('(max-width: 800px)');
const floatingContext = window.matchMedia('(max-width: 1180px)');
let copilotTrigger = null;

function syncPanels() {
  const drawer = $('drawer');
  const target = ui.sidebar && compactNavigation.matches ? $('sidebar')
    : ui.inspector && floatingContext.matches ? $('inspector') : null;
  const previous = drawer.firstElementChild;
  if (previous !== target) {
    if (drawer.open) drawer.close();
    if (previous?.id === 'sidebar') $('workspace').before(previous);
    if (previous?.id === 'inspector') $('workspace').after(previous);
    if (target) {
      drawer.setAttribute('aria-label', target.getAttribute('aria-label'));
      drawer.append(target);
      drawer.showModal();
    }
  }
  for (const [action,expanded] of [['sidebar',ui.sidebar],['copilot',ui.inspector]]) {
    $('topbar').querySelector('[data-action="' + action + '"]')?.setAttribute('aria-expanded',String(expanded));
  }
}

function toggleNavigation(open) {
  ui.sidebar = open && compactNavigation.matches;
  if (ui.sidebar && floatingContext.matches) ui.inspector = false;
  renderInspector();
  if (ui.sidebar) $('sidebar').querySelector('[aria-current]')?.focus();
  else $('topbar').querySelector('[data-action="sidebar"]')?.focus();
}

function closeInspector() {
  ui.inspector = false;

const deliveryStageLabels = {draft:'Entwurf',blocked:'Klärungsbedarf',ready:'Übergabebereit',factory:'In der Factory',review:'In Review',done:'Abgenommen'};

function deliveryStage(request) {
  if (request.status==='In Review' && (!request.commit || stale(request))) return 'blocked';
  if (request.status==='Freigegeben' && !canDispatch(request)) return 'blocked';
  if (['Rückfrage','Fehlgeschlagen','Änderung angefragt'].includes(request.status)) return 'blocked';
  if (['Warteschlange','Läuft'].includes(request.status)) return 'factory';
  if (request.status==='In Review') return 'review';
  if (request.status==='Abgenommen') return 'done';
  if (request.status==='Freigegeben') return 'ready';
  return 'draft';
}

const overviewScopes=new Map();

function overviewContexts(p) {
  const jobs=p.docs.filter(doc=>doc.kind==='JTBD');
  const prds=p.docs.filter(doc=>doc.kind==='PRD');
  const context=(kind,record,prd,map,jobIds)=>({key:`${kind}:${record.id}`,record,prd,map,jobs:jobs.filter(job=>jobIds.includes(job.id))});
  const mapped=projectStoryMaps().map(map=>{
    const prd=prds.find(doc=>doc.id===map.prdId);
    return context('map',map,prd,map,[...(map.jobIds||[]),...(prd?.jobIds||[])]);
  });
  const unmapped=prds.filter(prd=>!mapped.some(row=>row.prd===prd)).map(prd=>context('prd',prd,prd,null,prd.jobIds||[]));
  const branches=[...mapped,...unmapped];
  const unplanned=jobs.filter(job=>!branches.some(row=>row.jobs.includes(job))).map(job=>context('job',job,null,null,[job.id]));
  return [...branches,...unplanned];
}

function overviewPlanning(p) {
  const contexts=overviewContexts(p);
  const selection=overviewScopes.get(p.id);
  const current=contexts.find(row=>row.key===selection)
    || contexts.find(row=>(row.prd&&`prd:${row.prd.id}`===selection)||row.jobs.some(job=>`job:${job.id}`===selection))
    || contexts[0] || {jobs:[],prd:null,map:null};
  const {prd,map,jobs}=current;
  const allJobs=p.docs.filter(doc=>doc.kind==='JTBD');
  const visions=p.docs.filter(doc=>doc.kind==='Vision');
  const vision=visions.find(doc=>doc.id===prd?.visionId)||visions.find(doc=>doc.status==='Freigegeben')||visions[0];
  const slice=map?.slices[0];
  const stories=slice?map.cards.filter(card=>card.sliceId===slice.id):[];
  const linksFor=card=>(card.links||[]).filter(ref=>ref.projectId===p.id).map(ref=>p.useCases.find(item=>item.id===ref.itemId)).filter(Boolean);
  const pbis=[...new Map(stories.flatMap(linksFor).map(item=>[item.id,item])).values()];
  const reviewed=stories.filter(card=>linksFor(card).length||card.backlogDeferredFor===slice.id).length;
  const finished=stories.length>0&&reviewed===stories.length;
  const step=map?(stories.length?5:4):prd?3:!jobs.length?0:!vision?1:2;
  const scope=slice?`${map.id}:${slice.id}`:'';
  const open=(items,action)=>items.map(item=>link(`${item.id} · ${item.title}`,action,item.id)).join('');
  const action=(label,key,id='',symbol='chevron')=>btn(label,key,{id,symbol,style:'primary'});
  const selector=contexts.length>1?`<div class="flow-scope-label"><label for="overview-scope">Planungskontext</label><select id="overview-scope" data-change="overview-scope">${selectOptions(contexts.map(row=>[row.key,`${row.record.id} · ${row.record.title}`]),current.key)}</select></div>`:'';
  const sample=jobs[0];
  const rows=[
    {title:'Jobs to be Done',text:jobs.length?'':prd||map?'Diesem Vorhaben ist noch kein Job zugeordnet.':'In welcher Situation möchte jemand etwas erreichen? Beschreibe den gewünschten Fortschritt.',
      records:open(jobs,'open-doc'),done:jobs.length,action:action(allJobs.length?'Weiteren Job beschreiben':'Ersten Job beschreiben','flow-job','','add')},
    {title:'Produktvision',text:vision?'':'Für wen soll das Produkt auf Dauer welchen Unterschied machen?',records:vision?open([vision],'open-doc'):'',done:vision,
      action:action('Produktvision formulieren','flow-vision',sample?.id)},
    {title:'PRD mit Anforderung',text:prd?'':'Welches Problem soll die erste Lieferung lösen? Woran erkennt ihr den Erfolg?',records:prd?open([prd],'open-doc'):'',done:prd,
      action:action('PRD ausarbeiten','flow-prd',sample?.id)},
    {title:'Story Map',text:map?'':'Ordne die Schritte, mit denen die Zielgruppe ihr Ziel erreicht.',records:map?open([map],'sm-open'):'',done:map,
      action:action('Story Map erstellen','flow-map',prd?.id)},
    {title:'Erster Lieferabschnitt',text:slice?slice.outcome||'Welches Nutzerergebnis soll dieser Abschnitt ermöglichen?':'Wähle einen ersten durchgängigen Ablauf und ordne ihm die nötigen Stories zu.',
      records:slice?link(slice.title,'sm-review',scope):'',done:stories.length,action:action(slice?'Stories einplanen':'Lieferabschnitt planen','sm-open',map?.id)},
    {title:'Übergabe ins Backlog',text:stories.length?`${reviewed} von ${stories.length} ${stories.length===1?'Story zugeordnet oder zurückgestellt':'Stories zugeordnet oder zurückgestellt'}.`:'Prüfe die Stories des ersten Abschnitts und ihre Zuordnung zu PBIs.',
      records:open(pbis,'open-uc'),done:finished,action:action('Stories fürs Backlog prüfen','sm-review',scope)}
  ];
  const items=rows.map((row,index)=>{
    const next=index===step&&!finished;
    const marker=row.done?icon('check'):String(index+1);
    return `<li${next?' aria-current="step"':''}><span class="flow-position${row.done?' complete':''}" aria-hidden="true">${marker}</span><div><h3>${row.title}</h3>${row.text?`<p>${e(row.text)}</p>`:''}${row.records?`<div class="flow-evidence">${row.records}</div>`:''}</div>${next?row.action:''}</li>`;
  }).join('');
  return `<section class="product-flow" aria-labelledby="project-planning-heading"><div class="product-flow-head"><h2 id="project-planning-heading">Vom Job zum Backlog</h2>${selector}</div><ol>${items}</ol>${allJobs.length?`<div class="flow-footer">${btn('Weiteren Job beschreiben','flow-job',{symbol:'add',style:'small quiet'})}</div>`:''}</section>`;
}

function overview() {
  const p = project();
  const ranked = rankItems(p.useCases);
  const buckets = Object.fromEntries(Object.keys(deliveryStageLabels).map(stage=>[stage,[]]));
  p.requests.forEach(request=>buckets[deliveryStage(request)].push(request));
  const missingBasics = ranked.filter(item=>item.status!=='Erledigt' && !lastRequest(item.id) && gaps(item).length);
  const todo = ranked.find(item=>item.status!=='Erledigt' && !lastRequest(item.id));
  const review = buckets.review[0];
  const blocked = buckets.blocked[0];
  const ready = buckets.ready[0];
  const running = buckets.factory[0];
  const draft = buckets.draft[0];

  let phase;
  if (review) {
    phase = {label:'Fachliche Abnahme steht an', tone:'purple', detail:`${review.id} · ${review.title}`, action:btn('Review öffnen','open-review',{id:review.id,style:'primary',symbol:'review'})};
  } else if (blocked) {
    phase = {label:'Ein Request braucht Klärung', tone:'warn', detail:`${blocked.id} · ${blocked.title}`, action:btn('Request prüfen','open-request',{id:blocked.id,style:'primary',symbol:'request'})};
  } else if (ready) {
    phase = {label:'Factory-Übergabe steht an', tone:'info', detail:`${ready.id} · ${ready.title}`, action:btn('Freigegebenes Paket öffnen','open-request',{id:ready.id,style:'primary',symbol:'request'})};
  } else if (running) {
    phase = {label:'Ein Request ist in der Factory', tone:'info', detail:`${running.id} · ${running.title}`, action:btn('Laufenden Request öffnen','open-request',{id:running.id,style:'primary',symbol:'request'})};
  } else if (draft) {
    phase = {label:'Übergabe wird vorbereitet', tone:'info', detail:`${draft.id} · ${draft.title}`, action:btn('Ready-Kriterien prüfen','open-request-gates',{id:draft.id,style:'primary',symbol:'request'})};
  } else if (todo) {
    phase = {label:'Nächsten Use-Case vorbereiten', tone:'info', detail:`${todo.id} · ${todo.title}`, action:btn('Use-Case öffnen','open-uc',{id:todo.id,style:'primary',symbol:'backlog'})};
  } else if (buckets.done.length) {
    phase = {label:'Abnahme dokumentiert', tone:'good', detail:`${buckets.done.length} ${buckets.done.length===1?'Request ist':'Requests sind'} fachlich abgenommen.`, action:btn('Abnahmen ansehen','delivery-drilldown',{id:'done',style:'primary',symbol:'review'})};
  } else {
    phase = {label:'Produktarbeit vorbereiten', tone:'', detail:'Lege im Backlog einen Use-Case an und verknüpfe ihn mit einer PRD-Anforderung.', action:btn('Backlog öffnen','go',{id:'backlog',style:'primary',symbol:'backlog'})};
  }

  const stages = Object.entries(deliveryStageLabels).map(([stage,label])=>`<button class="stage-metric${buckets[stage].length?' has-requests':''}" type="button" data-action="delivery-drilldown" data-id="${stage}" aria-label="${e(`${label}, ${buckets[stage].length} Feature Requests anzeigen`)}"><span>${e(label)}</span><strong>${buckets[stage].length}</strong></button>`).join('');
  const featured = review || blocked || ready || running || draft || todo;
  const tasks = [
    ...buckets.review.map(r=>[r.id, r.title, 'Fachliche Abnahme', 'open-review', 'review']),
    ...buckets.blocked.map(r=>[r.id, r.title, stale(r)?'Folgerevision prüfen':r.status==='In Review'?'Prüfstand klären':r.status, 'open-request', 'info']),
    ...buckets.ready.map(r=>[r.id, r.title, 'An Factory übergeben', 'open-request', 'request']),
    ...buckets.draft.map(r=>[r.id, r.title, 'Ready-Kriterien prüfen', 'open-request-gates', 'check']),
    ...missingBasics.map(u=>[u.id, u.title, gaps(u)[0], 'open-uc', 'backlog'])
  ].filter(([id])=>id!==featured?.id).slice(0,5);
  const next = tasks.length ? `<section>${section('Weitere Aufgaben')}<ul class="next-steps">${tasks.map(([id,name,reason,action,glyph])=>`<li><button class="next-step" type="button" data-action="${action}" data-id="${e(id)}"><span class="next-step-symbol">${icon(glyph)}</span><span><strong>${e(name)}</strong><small>${e(id)} · ${e(reason)}</small></span>${icon('chevron')}</button></li>`).join('')}</ul></section>` : '';

  const workRows = ranked.map(item => {
    const r = lastRequest(item.id);
    const status = r && deliveryStage(r)==='blocked' ? 'Blockiert' : r?.status || (item.status==='Erledigt'?'Kein Request':gaps(item).length?'Unterlagen offen':'Startklar');
    return `<tr><td>${link(item.title,'open-uc',item.id,'backlog')}<small class="row-meta">${e(item.id)} · ${e(parentLabel(item))}</small></td><td data-overview-label="Priorität">${priorityBadge(item.priority)}</td><td data-overview-label="Backlog">${badge(item.status)}</td><td data-overview-label="Lieferstand">${badge(status)}</td></tr>`;
  }).join('');
  const artefacts = p.docs.filter(d=>['Vision','JTBD','PRD'].includes(d.kind)).map(d=>`<tr><td>${link(d.title,'open-doc',d.id,kindIcon[d.kind])}<small class="row-meta">${e(d.id)} · ${e(d.kind)}</small></td><td data-overview-label="Verantwortlich">${e(d.owner)}</td><td data-overview-label="Stand">${badge(d.status)}</td></tr>`).join('');

  const delivery=`<section class="overview-status panel"><span class="phase-icon">${icon(review?'review':blocked?'info':ready||running||draft?'request':todo?'backlog':buckets.done.length?'checkCircle':'backlog')}</span><div><h2>${e(phase.label)}</h2><p class="phase-detail">${e(phase.detail)}</p></div>${phase.action}</section>` +
    `<div class="overview-summary"><section>${section('Lieferstand',btn('Alle Requests','go',{id:'requests',style:'small quiet',symbol:'request'}))}<div class="delivery-stages panel" role="group" aria-label="Feature Requests nach Lieferstand">${stages}</div></section>${next}</div>` +
    section('Priorisierte Use-Cases', btn('Backlog öffnen','go',{id:'backlog',style:'small quiet',symbol:'backlog'})) + table('Priorisierte Use-Cases',['PBI','Priorität','Backlog','Lieferstand'],workRows);
  const knowledge=artefacts?`<details class="overview-secondary"><summary>Alle Projektgrundlagen</summary>${section('Projektgrundlagen',btn('Wissen öffnen','go',{id:'knowledge',style:'small quiet',symbol:'book'}))}${table('Projektgrundlagen',['Artefakt','Verantwortlich','Stand'],artefacts)}</details>`:'';
  const planning=overviewPlanning(p);
  const downstream=ranked.length?delivery:`<div class="overview-summary"><section>${section('Lieferstand',btn('Alle Requests','go',{id:'requests',style:'small quiet',symbol:'request'}))}<div class="delivery-stages panel" role="group" aria-label="Feature Requests nach Lieferstand">${stages}</div></section></div>`;
  return title(p.name,p.product)+(p.requests.length?delivery+planning:planning+`<details class="overview-secondary"><summary>Lieferstand und Backlog ansehen</summary>${downstream}</details>`)+knowledge;
}

function foundationAction(key,id) {
  const source=id?getDoc(id):null;
  if (id && (!source || source.kind!==(key==='flow-map'?'PRD':'JTBD'))) return;
  if (key==='flow-job') { newDoc('JTBD',{guided:true}); return; }
  if (key==='flow-research') { if (source) newDoc('Research',{guided:true,job:source.id}); return; }
  if (key==='flow-map') { if (source) storyMapForm(null,source); return; }
  if (key==='flow-prd') {
    const vision=ui.route==='doc'&&getDoc(ui.id)?.kind==='Vision'?getDoc(ui.id):projectVision(id);
    newDoc('PRD',{guided:true,job:id,vision:vision?.id}); return;
  }
  const vision=projectVision(id);
  if (!vision) { newDoc('Vision',{guided:true,job:id}); return; }
  ui.visionOrigin={project:project().id,vision:vision.id,job:id}; go('doc',vision.id);
}

function sectionValue(body,heading) {
  const lines=String(body||'').split(/\r?\n/);
  const start=lines.findIndex(line=>heading.test(line));
  if (start===-1) return '';
  for (const line of lines.slice(start+1)) {
    if (/^#/.test(line)) break;
    if (line.trim()) return line.trim();
  }
  return '';
}

function entityTargetRecord(kind,id) {
  if (kind==='prd') {
    const doc=getDoc(id);
    return doc?.kind==='PRD'?doc:undefined;
  }
  return nfrTargetRecord(kind,id);
}

function entityTargetKey(ref) {return ref.kind+':'+ref.id;}

function entitiesLinkedToTarget(kind,id) {
  if (!entityTargetRecord(kind,id)) return [];
  return project().docs.filter(note=>note.kind==='Entität' &&
    (note.domainTargets || []).some(ref=>ref.kind===kind && ref.id===id));
}

function normalizedEntityTargets(note,targets) {
  if (note?.kind!=='Entität' || getDoc(note.id)!==note || !Array.isArray(targets)) return null;
  const previous=new Set((note.domainTargets || []).map(entityTargetKey));
  const unique=new Map();
  for (const ref of targets) {
    if (!ref || !['item','map','prd'].includes(ref.kind) || typeof ref.id!=='string' || !ref.id ||
        (ref.projectId && ref.projectId!==project().id)) return null;
    const key=entityTargetKey(ref);
    if (!previous.has(key) && (note.domainArchived || !entityTargetRecord(ref.kind,ref.id))) return null;
    unique.set(key,{kind:ref.kind,id:ref.id});
  }
  return [...unique.keys()].sort().map(key=>unique.get(key));
}

function applyEntityTargets(note,targets) {
  const old=(note.domainTargets || []).map(entityTargetKey).sort();
  if (old.length===targets.length && targets.every((ref,i)=>entityTargetKey(ref)===old[i])) return;
  note.domainTargets=targets;
  domainDraftRevision(note,'Produktumfang geändert');
}

function setEntityTargets(note,targets) {
  const valid=normalizedEntityTargets(note,targets);
  if (!valid) return false;
  applyEntityTargets(note,valid);
  return true;
}

function setTargetEntities(kind,id,entityIds) {
  if (!entityTargetRecord(kind,id) || !Array.isArray(entityIds)) return false;
  const selected=new Set(entityIds);
  if ([...selected].some(key=>getDoc(key)?.kind!=='Entität')) return false;
  const changes=[];
  for (const note of project().docs.filter(d=>d.kind==='Entität')) {
    const refs=note.domainTargets || [];
    const isTarget=ref=>ref.kind===kind && ref.id===id;
    const linked=refs.some(isTarget);
    if (linked===selected.has(note.id)) continue;
    const valid=normalizedEntityTargets(note,linked?refs.filter(ref=>!isTarget(ref)):[...refs,{kind,id}]);
    if (!valid) return false;
    changes.push([note,valid]);
  }
  for (const [note,targets] of changes) applyEntityTargets(note,targets);
  return true;
}

function domainForScope(kind,id) {
  const origins=new Map();
  const mapFoundations=new Map();
  const add=(kind,record)=>origins.set(kind+':'+record.id,{kind,id:record.id,title:record.title});
  const addPrd=id=>{
    const prd=entityTargetRecord('prd',id);
    if (prd) add('prd',prd);
  };
  const expand=(kind,id)=>{
    const record=entityTargetRecord(kind,id);
    if (!record) return;
    if (kind==='prd') {add('prd',record);return;}
    for (const [key,origin] of productScopeOrigins(kind,record)) {
      if (origins.has(key)) continue;
      origins.set(key,origin);
      if (origin.kind==='item') {
        const item=backlogItem(origin.id);
        if (item?.type==='PBI') addPrd(item.req);
      } else if (origin.kind==='map') {
        const map=entityTargetRecord('map',origin.id);
        addPrd(map.prdId);
        for (const path of mapFoundationPaths(map)) {
          const entry=vaultResolve(path);
          const note=entry?.kind==='doc'?getDoc(entry.id):null;
          if (note?.kind==='PRD') add('prd',note);
          if (note?.kind==='Entität') {
            if (!mapFoundations.has(note.id)) mapFoundations.set(note.id,new Map());
            mapFoundations.get(note.id).set(key,origin);
          }
        }
      }
    }
  };
  if (kind==='nfr') {
    const nfr=projectNfrs().find(n=>n.id===id);
    for (const ref of nfr?.targets || []) expand(ref.kind,ref.id);
  } else expand(kind,id);

  const entities=[];
  for (const note of domainEntities()) {
    const matches=new Map(mapFoundations.get(note.id) || []);
    for (const ref of note.domainTargets || []) {
      const key=entityTargetKey(ref);
      if (origins.has(key)) matches.set(key,origins.get(key));
    }
    if (!matches.size) continue;
    entities.push({id:note.id,title:note.title,definition:note.body || '',
      attributes:(note.domainAttributes || []).map(({name,description})=>({name,description:description||''})),
      sources:[...matches.keys()].sort().map(key=>matches.get(key))});
  }
  const byId=(a,b)=>a.id.localeCompare(b.id);
  entities.sort(byId);
  const scoped=new Set(entities.map(note=>note.id));
  const context=new Map(),relationships=[];
  for (const edge of domainEdges()) {
    if (!scoped.has(edge.fromId) && !scoped.has(edge.toId)) continue;
    const from=getDoc(edge.fromId),to=getDoc(edge.toId);
    for (const note of [from,to]) if (!scoped.has(note.id)) context.set(note.id,{id:note.id,title:note.title});
    relationships.push({id:edge.id,fromId:from.id,fromTitle:from.title,toId:to.id,toTitle:to.title,
      verb:edge.verb,fromCard:edge.fromCard,toCard:edge.toCard,description:edge.description || ''});
  }
  return {entities,contextEntities:[...context.values()].sort(byId),relationships:relationships.sort(byId)};
}

function knowledgeExcerpt(body,kind) {
  const line=String(body||'').split(/\r?\n/).map(s=>s.trim()).find(s=>s&&!/^(#|```|\[.*\]\(https?:)/.test(s));
  const headings=String(body||'').split(/\r?\n/).filter(s=>/^#{1,6}\s/.test(s));
  const fallback=headings.find(heading=>!(templates[kind]||'').split('\n').includes(heading))?.replace(/^#{1,6}\s+/, '');
  return (line||fallback)?.replace(/^([-*>]\s+|\d+\.\s+)/,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/(\*\*|__|`)/g,'')||'';
}

    const matchesType=ui.knowledge==='Konzepte'?conceptKinds.includes(d.kind)&&(ui.conceptKind==='Alle'||d.kind===ui.conceptKind):ui.knowledge==='Alle'||d.kind===ui.knowledge;
    const matchesActor=ui.knowledge!=='Akteur'||!ui.actorFilter||d.actorType===ui.actorFilter;
    return matchesType&&matchesActor&&`${d.id} ${d.title} ${d.requirement||''} ${knowledgeType(d)} ${d.owner}`.toLocaleLowerCase('de').includes(query);
  });
  const filtered=Boolean(query||ui.knowledge!=='Alle');
  const summary=`<div class="catalog-summary"><span role="status">${docs.length} ${docs.length===1?'Notiz':'Notizen'}</span>${filtered?btn('Filter zurücksetzen','knowledge-clear',{symbol:'undo',style:'quiet small'}):''}</div>`;
  if (!docs.length) return summary+panel(empty(filtered?'Keine passenden Notizen. Ändere den Suchbegriff oder setze die Filter zurück.':'In diesem Projekt gibt es noch keine Notizen. Lege die erste aus einer Vorlage an.'));
  const knownKinds=knowledgeShelves.flatMap(([,kinds])=>kinds);
  const shelves=[...knowledgeShelves,['Weitere Notizen',[...new Set(docs.filter(d=>!knownKinds.includes(d.kind)).map(d=>d.kind))]]];
  return summary+shelves.map(([name,kinds])=>{
    const entries=docs.filter(d=>kinds.includes(d.kind)).sort((a,b)=>kinds.indexOf(a.kind)-kinds.indexOf(b.kind));
    return entries.length?`<section class="library-shelf"><h2>${e(name)}</h2><ul>${entries.map(knowledgeEntry).join('')}</ul></section>`:'';
  }).join('');
}

function knowledge() {
  const concepts=ui.knowledge==='Konzepte';
  const actors=ui.knowledge==='Akteur'?`<label for="knowledge-actor-filter">Akteurstyp<select id="knowledge-actor-filter" data-change="knowledge-actor-type">${selectOptions([['','Alle Akteurstypen'],...Object.entries(actorTypes)],ui.actorFilter||'')}</select></label>`:'';
  const filters=`<div class="knowledge-filters"><div class="knowledge-search-row"><label for="knowledge-search">Wissen durchsuchen</label><div class="knowledge-search-field">${icon('search')}<input id="knowledge-search" type="search" placeholder="Titel, ID, Typ oder Person" data-input="knowledge" value="${e(ui.knowledgeQuery)}"></div></div>${concepts?`<label>Konzepttyp<select data-change="concept-kind">${selectOptions([['Alle','Alle Konzepttypen'],...conceptKinds],ui.conceptKind)}</select></label>`:''}${actors}</div>`;
  const createLabel=concepts?'Konzept anlegen':ui.knowledge==='Alle'?'Notiz anlegen':`${ui.knowledge} anlegen`;
