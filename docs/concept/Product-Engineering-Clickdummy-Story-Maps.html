<style>:root {

* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: var(--base); font: 14px/1.48 var(--font); }

.topbar { min-height: var(--header-height); padding: .4rem 1.15rem .4rem 1rem; display: grid; grid-template-columns: calc(var(--nav-width) - 1rem) minmax(0,1fr) auto; gap: 1rem; align-items: center; border-bottom: 1px solid var(--line); background: var(--paper); position: sticky; top: 0; z-index: 8; }
.brand { display: flex; align-items: center; gap: .6rem; min-width: 0; }

.nav-width-toggle { display: none; }
@media (min-width: 801px) {
  .nav-section-heading { display: flex; gap: .3rem; align-items: center; justify-content: space-between; margin-bottom: .18rem; }
  .nav-section-heading .nav-label { padding-bottom: 0; }

  .layout.nav-compact { --nav-width: 60px; }
  .layout.nav-compact > .workspace { max-width: none; margin-inline: 0; padding-inline: clamp(1rem,1.6vw,2rem); }
  .nav-compact .sidebar-inner { gap: .85rem; padding: .75rem .43rem; overflow-x: hidden; }

}
.sidebar :focus-visible { outline-color: #c4b2ff; }
.workspace { min-width: 0; padding: clamp(1.4rem,2.4vw,2.45rem) clamp(1.1rem,2.5vw,2.8rem) 3.3rem; max-width: 1540px; width: 100%; margin: 0 auto; }
.inspector { min-width: 0; background: var(--paper); border-left: 1px solid var(--line); }

  const value = location.hash.replace(/^#\/?/, '');
  if (value === 'workspace') return;
  if (!value) {
    const firstMap = projectStoryMaps()[0];
    ui.route = firstMap ? 'storymap' : 'overview';
    ui.id = firstMap?.id || '';
    return;
  }
  try {
    const parts=value.split('/');
    if (parts[0]==='project') {
      const id=decodeURIComponent(parts[1]||'');
      const target=state.projects.find(p=>p.id===id);
      if (!target) {ui.route='overview';ui.id='';return;}
      if (target.id!==state.active) {
        state.active=target.id;ui.traceId='';ui.knowledge='Alle';ui.knowledgeQuery='';ui.conceptKind='Alle';ui.actorFilter='';ui.deliveryFilter='';resetBacklogView();persist();
      }
      parts.splice(0,2);
    }
    const [area,encoded]=parts;
    const route=Object.hasOwn(routeLabel,area)?area:'overview';
    const id=decodeURIComponent(encoded||'');
    if (ui.route!==route||ui.id!==id) resetViewTabs();
    ui.route=route;ui.id=id;
    if (route==='usecase') {
      const tab=parts[2]==='tab'?decodeURIComponent(parts[3]||''):'';
      ui.pbiTab=pbiReadingTabs.includes(tab)?tab:'Use-Case';
    }
    if (route==='backlog') ui.backlogView=id==='deliverables'?'Deliverables':id==='nfrs'?'NFRs':id==='list'?'Baum':'Board';
  } catch { ui.route='overview';ui.id=''; }
}

function rememberWorkspaceOrigin() {
  const workspace=$('workspace');
  const button=document.activeElement?.closest('button[data-action]');
  if(!button||!workspace.contains(button))return;
  const action=button.dataset.action,id=button.dataset.id||'';
  const peers=[...workspace.querySelectorAll('button[data-action]')].filter(el=>el.dataset.action===action&&(el.dataset.id||'')===id);
  history.replaceState({...history.state,workspaceReturn:{hash:location.hash,action,id,index:peers.indexOf(button),left:scrollX,top:scrollY}},'');

function focusWorkspace(restore=false) {
  const workspace=$('workspace'),last=restore&&history.state?.workspaceReturn;
  if(last&&last.hash===location.hash) {
    const peers=[...workspace.querySelectorAll('button[data-action]')].filter(el=>el.dataset.action===last.action&&(el.dataset.id||'')===last.id);
    const button=peers[last.index];
    if(button&&!button.disabled&&button.getClientRects().length) {
      button.focus({preventScroll:true});
      window.scrollTo(last.left||0,last.top||0);
      requestAnimationFrame(()=>{
        if(location.hash===last.hash&&document.activeElement===button)window.scrollTo(last.left||0,last.top||0);

      return;

function gherkin(u) {

  return `# language: de\nFunktionalität: ${u.title}\n\n${scenarios.join('\n\n')}`;
}

function requestDocuments(u) {

function snapshot(u, scope = 'Gesamter Use-Case') {
  const req = getDoc(u.req);
  return {project:{id:project().id, repo:project().repo, branch:project().branch}, scope, useCase:{...copy(u), commit:gitHead(u.id)?.sha}, requirement:req ? {id:u.requirement, artifact:req.id, revision:req.rev, commit:gitHead(req.id)?.sha} : null,
    attachments:requestDocuments(u).map(d=>({id:d.id, revision:d.rev, commit:gitHead(d.id)?.sha, title:d.title, text:d.body})), gherkin:gherkin(u), dataClass:project().dataClass};
}

function stale(r) {
  if (!r.snapshot) return false;
  const destination=r.snapshot.project;
  if (destination.repo!==project().repo||destination.branch!==project().branch||r.snapshot.dataClass!==project().dataClass) return true;
  const current = getUseCase(r.uc);
  return !current || current.rev !== r.snapshot.useCase.rev || r.snapshot.attachments.some(d => getDoc(d.id)?.rev !== d.revision);
}

function gaps(u) {
  if (!u) return ['PBI auswählen'];
  const errors = [];
  if (!u.req || !u.requirement || !getDoc(u.req)) errors.push('PRD-Anforderung verknüpfen');
  else if (getDoc(u.req).status !== 'Freigegeben') errors.push('PRD freigeben');
  const required = (label) => project().rules.some(([name,,enabled])=>name===label && enabled);
  if (!project().docs.some(d=>d.kind==='Vision'&&d.status==='Freigegeben')) errors.push('Produktvision freigeben');
  if (required('Research-Fundstelle für JTBD') && (!getDoc(u.job) || !getDoc(u.research))) errors.push('JTBD und Research-Fundstelle verknüpfen');
  if ((required('ADR bei Integrationsänderungen')||required('Verknüpften ADR prüfen')) && u.adr && getDoc(u.adr)?.status!=='Freigegeben') errors.push('Verknüpften ADR freigeben');
  if (u.review !== 'Freigegeben') errors.push('Use-Case fachlich freigeben');
  if (!u.criteria.length) errors.push('Mindestens ein Akzeptanzkriterium ergänzen');
  if (u.criteria.some(c => !c.scenario || !c.given || !c.when || !c.then)) errors.push('Vollständiges Gherkin-Szenario je Kriterium ergänzen');
  if (!project().repo) errors.push('Git-Repository zuordnen');
  return errors;
}

'use strict';

const backlogKinds = ['Epic','Feature','PBI'];
const priorityOptions = [['P1','P1 · Hoch'],['P2','P2 · Normal'],['P3','P3 · Niedrig']];
const backlogLevels = [['Alle','Alle Ebenen'],['Epic','Epics'],['Feature','Features'],['PBI','PBIs'],['Task','Tasks'],['Issue','Issues'],['Frage','Fragen'],['Bug','Bugs']];
const kindSymbol = {Epic:'crown',Feature:'award',PBI:'book'};
const rankItems = (rows) => [...rows].sort((a,b)=>a.order-b.order || a.id.localeCompare(b.id));
const backlogItems = (p = project()) => [...p.groups,...p.useCases,...(p.work||[])];
const backlogItem = (id) => backlogItems().find(x=>x.id===id);
const children = (parent) => rankItems(backlogItems().filter(x=>x.parent===parent));
const parentLabel = (item) => backlogItem(item.parent)?.title || item.feature || '';
const priorityBadge = (p) => badge(p || 'P2',p==='P1'?'warn':p==='P3'?'':'info');

function resetBacklogView() {
  ui.deliverableStatus='';ui.deliverableKind='';ui.deliverableQuery='';
  ui.nfrFilter=''; ui.nfrQuery='';
  ui.backlogQuery=''; ui.backlogStatus='Alle'; ui.backlogPriority='Alle'; ui.backlogFocus='Alle'; ui.collapsed.clear(); ui.backlogUndo=null; ui.backlogView='Board';
  ui.backlogDelivery=false; ui.backlogFoldInitializedFor=null;
}

function setupBacklogs() {
  for (const p of state.projects) {
    if (p.groups) continue;
    p.groups=[];
    const isPortal=p.id==='kundenportal';
    if (!p.useCases.length && !isPortal && p.id!=='admin-console') continue;
    p.groups.push({id:'EP-01',type:'Epic',title:isPortal?'Servicearbeit vereinfachen':p.id==='admin-console'?'Zugriffsverwaltung':'Produktvorhaben',parent:null,priority:'P1'});
    if (isPortal) p.groups.push({id:'EP-02',type:'Epic',title:'Support-Aufwand senken',parent:null,priority:'P2'});
    const addFeature = (title,parent) => {
      const feature = {id:nextId('FE',p.groups),type:'Feature',title,parent,priority:'P2'};
      p.groups.push(feature);
      return feature;
    };
    if (isPortal) {
      addFeature('Servicefälle verwalten','EP-01').priority='P1';
      addFeature('Übergaben koordinieren','EP-01');
      addFeature('Hilfe in der Fallübersicht','EP-02');
    } else if (!p.useCases.length) addFeature('Rollen und Rechte','EP-01');
    for (const u of p.useCases) {
      const title = isPortal && u.id==='UC-12' ? 'Hilfe in der Fallübersicht' : u.feature || 'Use-Cases';
      const f=p.groups.find(x=>x.type==='Feature'&&x.title===title) || addFeature(title,'EP-01');
      Object.assign(u,{type:'PBI',parent:f.id,priority:u.id==='UC-09'?'P1':'P2'});
    }
    const all=backlogItems(p);
    let order=0;
    function rankBranch(parent) {
      all.filter(x=>x.parent===parent).forEach(item=>{item.order=(++order)*1000;rankBranch(item.id);});
    }
    rankBranch(null);
  }
}

function validParent(type,parent) {
  if (workTypes.includes(type)) return !!getUseCase(parent);
  if (!backlogKinds.includes(type)) return false;
  if (type==='Epic') return parent===null;
  return backlogItem(parent)?.type===backlogKinds[backlogKinds.indexOf(type)-1];
}

function rankingPeers(item,parent=item.parent) {
  if (ui.backlogFocus!=='Alle' && parent===item.parent) {
    return rankItems(backlogItems().filter(row=>row.type===item.type));
  }
  return children(parent);
}

function locationForDrop(source,target,zone) {
  if (!source || !target || source===target) return null;
  if (zone==='inside') {
    if (!validParent(source.type,target.id)) return null;
    const peers=children(target.id);
    if (peers.at(-1)===source) return null;
    return {parent:target.id,anchor:peers.filter(x=>x!==source).at(-1)?.id || target.id,zone:'after'};
  }
  const focused=ui.backlogFocus!=='Alle';
  if (focused ? source.type!==target.type : source.parent!==target.parent) return null;
  const peers=rankingPeers(source);
  const targetIndex=peers.indexOf(target);
  if (targetIndex<0 || peers[targetIndex+(zone==='before'?-1:1)]===source) return null;
  return {parent:source.parent,anchor:target.id,zone};
}

function rankedPosition(all,source,anchor,zone) {
  const others=rankItems(all.filter(x=>x!==source));
  const target=others.findIndex(x=>x.id===anchor);
  const index=target<0 ? others.length : target+(zone==='after'?1:0);
  const before=others[index-1]?.order;
  const after=others[index]?.order;
  if (before===undefined) return (after ?? 1000)-1000;
  if (after===undefined) return before+1000;
  return before+(after-before)/2;
}

function redoLayout(id) {
  const previousAction=document.activeElement?.dataset.action;
  persist(); render();
  if (id) {
    const row=$('backlog-results')?.querySelector(`tr[data-backlog-id="${CSS.escape(id)}"]`);
    const controls=[...(row?.querySelectorAll('button[data-action]')||[])];
    const target=previousAction==='backlog-fold' ? controls.find(button=>button.dataset.action===previousAction) : row?.querySelector('.drag-grip');
    target?.focus({preventScroll:true});
  }
}

function updateBacklog(source,patch,placement) {
  const all=backlogItems();
  const previous=all.map(item=>({id:item.id,order:item.order,parent:item.parent,priority:item.priority}));
  if (placement) {
    const {parent,anchor,zone}=placement;
    let order=rankedPosition(all,source,anchor,zone);
    if (all.some(item=>item!==source&&item.order===order)) {
      rankItems(all).forEach((item,i)=>{item.order=(i+1)*1000;});
      order=rankedPosition(all,source,anchor,zone);
    }
    Object.assign(source,{parent,order});
    ui.collapsed.delete(parent);
  }
  if (patch.title!==undefined && patch.title!==source.title && source.type==='PBI') { source.rev++; source.review='Entwurf'; }
  Object.assign(source,patch);
  const changed=previous.filter(old=>{
    const item=backlogItem(old.id);
    return item.order!==old.order || item.parent!==old.parent || item.priority!==old.priority;
  });
  if (changed.length) ui.backlogUndo={project:project().id,rows:changed,focus:source.id};
  redoLayout(source.id);
  toast(`${source.id} aktualisiert`);
}

function undoBacklog() {
  if (ui.backlogUndo?.project!==project().id) return;
  const {rows,focus}=ui.backlogUndo;
  rows.forEach(({id,order,parent,priority})=>{ const item=backlogItem(id); if (item) Object.assign(item,{order,parent,priority}); });
  ui.backlogUndo=null;
  redoLayout(focus);
  toast('Anordnung oder Priorität wiederhergestellt');
}

function ancestors(item,lookup=backlogItem) {
  const found=[];
  const seen=new Set([item.id]);
  for (let parent=lookup(item.parent); parent&&!seen.has(parent.id); parent=lookup(parent.parent)) {
    seen.add(parent.id);
    found.unshift(parent);
  }
  return found;
}

function pbiBoardStage(item) {
  if (item.type!=='PBI'||item.stageChosen||item.status==='Erledigt'||item.status==='In Development') return item.status;
  const running=linkedRequests(item.id).some(r=>['Warteschlange','Läuft','Rückfrage','Fehlgeschlagen','In Review'].includes(r.status)||(r.status==='Änderung angefragt'&&r.run));
  return running?'In Development':item.status;
}

function workItemMatches(item,parents) {
  if (ui.backlogStatus!=='Alle' && pbiBoardStage(item)!==ui.backlogStatus) return false;
  if (ui.backlogPriority!=='Alle' && item.priority!==ui.backlogPriority) return false;
  const query=ui.backlogQuery.trim().toLocaleLowerCase('de');
  if (!query) return true;
  return [...parents.flatMap(x=>[x.id,x.title]),item.id,item.title,item.type,item.owner||''].join(' ').toLocaleLowerCase('de').includes(query);
}

function workItemRow(item,depth,position,itemChildren,parents,context=false,forcedOpen=false) {
  const u=item.type==='PBI'?item:null;
  const r=u&&ui.backlogDelivery?lastRequest(u.id):null;
  const focused=ui.backlogFocus!=='Alle';
  const work=workTypes.includes(item.type);
  const group=!u&&!work;
  const folded=ui.collapsed.has(item.id)&&!forcedOpen;
  const action=u?'open-uc':work?'edit-work':'backlog-edit';
  const symbol=kindSymbol[item.type]||workIcons[item.type];
  const hierarchy=parents.map(x=>x.title).join(' / ');
  const openWork=u&&itemChildren.length?`${itemChildren.filter(child=>child.status!=='Erledigt').length} von ${itemChildren.length} offen`:'';
  const groupCount=`${itemChildren.length} ${item.type==='Epic'?'Feature':'PBI'}${itemChildren.length===1?'':'s'}`;
  const twisty=itemChildren.length && ui.backlogFocus==='Alle' && !forcedOpen
    ? `<button type="button" class="icon-button twisty" data-action="backlog-fold" data-id="${e(item.id)}" aria-expanded="${!folded}" aria-label="${e(item.title)} ${folded?'aufklappen':'einklappen'}">${icon(folded?'chevron':'down')}</button>` : '<span class="backlog-control-spacer" aria-hidden="true"></span>';
  const grip=context?'':`<button type="button" class="icon-button drag-grip" draggable="true" data-action="backlog-edit" data-id="${e(item.id)}" aria-label="${e(item.id)} anordnen und priorisieren" title="Ziehen oder Anordnung öffnen">${icon('grip')}</button>`;
  const guides=depth?`<span class="backlog-guides" aria-hidden="true">${'<i></i>'.repeat(depth)}</span>`:'';
  const count=group?groupCount:openWork;
  const priority=item.priority||'P2';
  const stage=pbiBoardStage(item);
  const priorityLabel=priorityOptions.find(([key])=>key===priority)?.[1]||priority;
  const priorityTag=`<span class="backlog-value">${icon('flag')}${e(priorityLabel)}</span>`;
  const actions=group?iconBtn(item.type==='Epic'?'Feature anlegen':'PBI anlegen',item.type==='Epic'?'new-feature':'new-pbi','add',item.id):
    (u?iconBtn(`Begleititem für ${item.id} erfassen`,'backlog-new','add',item.id):'')+iconBtn('Git-Historie '+item.id,'item-git','git',item.id);
  return `<tr class="backlog-row backlog-${e(item.type.toLowerCase())}${context?' context-row':''}" data-backlog-id="${e(item.id)}"${context?' data-context="true"':''}>
    ${focused?`<td class="rank-value" data-column="Rang">${position}</td>`:''}
    <th scope="row" class="backlog-name">${guides}<div class="backlog-title" style="--depth:${depth}">${twisty}<span class="backlog-type-icon">${icon(symbol)}${e(item.type)}</span><div class="backlog-name-text">${context?`<span class="row-main">${e(item.title)}</span>`:link(item.title,action,item.id)}<small class="backlog-identity">${e(item.id)}${count?`<span>${e(count)}</span>`:''}</small>${context?'':sourcePrototypeCount(item)}${u&&!context?compactRequestLinks(u):''}${focused&&hierarchy?`<small class="backlog-parent-path">${e(hierarchy)}</small>`:''}</div></div></th>
    <td data-column="Verantwortlich"${item.owner?'':' class="backlog-no-value"'}>${item.owner?`<span class="backlog-value">${icon('person')}${e(item.owner)}</span>`:'<span class="backlog-sr">Nicht zugewiesen</span>'}</td>
    <td data-column="Status"${item.status?'':' class="backlog-no-value"'}>${item.status?`<span class="backlog-value">${item.status==='Erledigt'?icon('checkCircle'):item.status==='In Arbeit'?icon('clock'):'<i class="backlog-open" aria-hidden="true"></i>'}${e(group?pbiStageLabel(stage):stage)}</span>`:'<span class="backlog-sr">Kein Status</span>'}</td>
    <td data-column="Priorität">${context?priorityTag:`<button type="button" class="text-button" data-action="backlog-edit" data-id="${e(item.id)}" aria-label="Priorität von ${e(item.id)} bearbeiten: ${e(priorityLabel)}">${priorityTag}</button>`}</td>
    ${ui.backlogDelivery?`<td data-column="Factory"${r?'':' class="backlog-no-value"'}>${r?badge(r.status):'<span class="backlog-sr">Kein Feature Request</span>'}</td><td data-column="Fachlich"${u?'':' class="backlog-no-value"'}>${u?badge(r?.status==='Abgenommen'?'Abgenommen':u.review):'<span class="backlog-sr">Kein fachlicher Status</span>'}</td>`:''}
    <td class="row-actions">${context?'':`<div class="inline">${grip}${actions}${prototypeFromItem(item)}</div>`}</td></tr>`;
}

function backlogResultHeading(name,count,filtered) {
  const total=filtered?`${count} Treffer`:`${count} ${count===1?'Eintrag':'Einträge'}`;
  return `<div class="backlog-results-head"><h2>${e(name)}</h2><span role="status">${total}</span>${filtered?btn('Filter zurücksetzen','backlog-clear',{id:'filters',style:'small quiet'}):''}</div>`;
}

function activePbiRequest(requests) {
  return requests.findLast(r=>r.status!=='Abgenommen');
}

function requestReference(r) {
  return `<div class="pbi-request-ref">${link(`${r.id} · ${r.title}`,'open-request',r.id)}${badge(r.status)}</div>`;
}

function backlogReturnCrumb() {
  const origin=savedBacklogOrigin();
  return origin?[[origin.view==='board'?'Zurück zum Board':'Zurück zur Liste','return-pbi-backlog','']]:[];
}

function compactRequestLinks(item) {
  const requests=linkedRequests(item.id);
  if (!requests.length) return '';
  const featured=activePbiRequest(requests)||requests.at(-1);
  const rest=requests.filter(r=>r!==featured).reverse();
  const more=rest.length?`<details><summary>Weitere Requests (${rest.length})</summary>${rest.map(requestReference).join('')}</details>`:'';
  return `<div class="pbi-request-links" role="group" aria-label="Verknüpfte Feature Requests">${requestReference(featured)}${more}</div>`;
}

function boardRequestHandoff(item) {
  const requests=linkedRequests(item.id);
  const references=compactRequestLinks(item);
  let next='';
  if (!activePbiRequest(requests)) {
    const missing=gaps(item);
    const git=requestGitGaps(item);
    const reason=missing[0]||(git.length?`Commit für ${git[0].id} ausstehend.`:'Bereit für den Request-Entwurf');
    const action=missing.length?link('PBI vorbereiten','open-uc',item.id):
      git.length?link('Git-Stand prüfen','item-git',git[0].id):link('Feature Request erstellen','new-request',item.id);
    next=`<div class="board-request-next"><span>${e(reason)}</span>${action}</div>`;
  }
  return `<div class="board-request"><strong>Feature Request</strong>${references}${next}</div>`;
}

function kanbanCard(item) {
  const person = item.owner || 'Nicht zugewiesen';
  const feature = parentLabel(item);
  const companions=workFor(item.id);
  const open=companions.filter(child=>child.status!=='Erledigt').length;
  const addWork=`<div class="kanban-work-actions">${btn('Begleititem erfassen','backlog-new',{id:item.id,symbol:'add',style:'small quiet'})}${companions.length?`<small>${open} von ${companions.length} offen</small>`:''}</div>`;
  return `<article class="kanban-card" draggable="true" data-board-card="${e(item.id)}" aria-label="${e(item.id+' · '+item.title)}">
    <div class="kanban-card-meta"><span class="kanban-key">${icon('book')}${e(item.id)}</span><span class="kanban-priority" title="${e(priorityOptions.find(([key])=>key===item.priority)?.[1] || item.priority || 'P2')}">${icon('flag')}${e(item.priority || 'P2')}</span></div>
    ${link(item.title,'open-uc',item.id)}
    ${feature?`<p class="kanban-feature">${e(feature)}</p>`:''}
    ${addWork}${sourcePrototypeCount(item)}<div class="kanban-card-foot"><span class="kanban-person" title="${e(person)}">${icon('person')}<span>${e(person)}</span></span>
      <div class="inline">${prototypeFromItem(item)}<label class="kanban-move" title="${e(item.id)} verschieben">${icon('moveCard')}<select data-change="board-status" data-id="${e(item.id)}" aria-label="${e(item.id)} verschieben">${selectOptions(pbiStageOptions,pbiBoardStage(item))}</select></label></div></div>
    ${boardRequestHandoff(item)}
  </article>`;
}

const boardEdgeStages=['Backlog','Erledigt'];
function foldedBoardStages() {
  const saved=project().viewPreferences?.foldedBoardStages;
  return Array.isArray(saved)?saved.filter(value=>boardEdgeStages.includes(value)):[];
}
function toggleBoardStage(stage) {
  if (!boardEdgeStages.includes(stage)) return;
  const folded=new Set(foldedBoardStages());
  if (folded.has(stage)) folded.delete(stage); else folded.add(stage);
  const p=project();
  p.viewPreferences={...p.viewPreferences,foldedBoardStages:[...folded]};
  persist();
  $('backlog-results').innerHTML=backlogContent();
  $('workspace').querySelector(`[data-action="board-fold"][data-id="${CSS.escape(stage)}"]`)?.focus({preventScroll:true});
}

function kanbanBoard(items,matches,filtered) {
  const folded=foldedBoardStages();
  const visible = items.filter(item=>item.type==='PBI' && matches.has(item.id));
  const hasPbis = project().useCases.length > 0;
  const heading = backlogResultHeading('Kanban-Board',visible.length,filtered && hasPbis);
  const feedback = visible.length ? '' : `<div class="kanban-empty">${hasPbis?'Keine PBIs entsprechen deinen Filtern.':'Hier erscheinen die PBIs deines Projekts.'}</div>`;
  const lanes = pbiStages.map(({value,label,tone,symbol})=>{
    const cards = visible.filter(item=>pbiBoardStage(item)===value);
    const closed=folded.includes(value),contentId=`board-items-${tone}`;
    const toggleName=`${label} ${closed?'ausklappen':'einklappen'}`;
    const toggle=boardEdgeStages.includes(value)?`<button type="button" class="icon-button kanban-fold" data-action="board-fold" data-id="${e(value)}" aria-label="${e(toggleName)}" title="${e(toggleName)}" aria-controls="${contentId}" aria-expanded="${!closed}">${icon('down')}</button>`:'';
    const add=value==='Backlog'?btn('PBI anlegen','board-new-pbi',{style:'small kanban-lane-add',symbol:'add'}):'';
    return `<section class="kanban-lane${closed?' is-collapsed':''}" data-board-stage="${e(value)}" data-tone="${tone}" aria-label="${e(label)}">
      <header class="kanban-lane-head"><span class="kanban-stage-icon">${icon(symbol)}</span><h3>${e(label)}</h3><span class="kanban-count" aria-label="${cards.length} PBIs">${cards.length}</span>${toggle}</header>
      <div id="${contentId}" class="kanban-stack"${closed?' hidden':''}>${cards.map(kanbanCard).join('') || (!add?'<p class="kanban-lane-empty">Keine PBIs</p>':'')}${add}</div>
    </section>`;
  });
  return heading + feedback + `<div class="kanban-scroll" tabindex="0" role="region" aria-label="PBI-Board mit sechs Statusspalten"><div class="backlog-board" style="--middle-lanes:${pbiStages.length-2}"${folded.includes('Backlog')?' data-backlog-folded':''}${folded.includes('Erledigt')?' data-done-folded':''}>${lanes.join('')}</div></div>`;
}

function moveBoardCard(id,status) {
  const item = getUseCase(id);
  if (!item || pbiBoardStage(item)===status || !pbiStages.some(stage=>stage.value===status)) return;
  item.status=status; item.stageChosen=true;
  flash(`${item.id} nach ${pbiStageLabel(status)} verschoben`);
  const action=$('workspace').querySelector(`[data-change="board-status"][data-id="${CSS.escape(id)}"]`);
  const fold=$('workspace').querySelector(`[data-action="board-fold"][data-id="${CSS.escape(status)}"][aria-expanded="false"]`);
  (fold || action || $('backlog-search'))?.focus({preventScroll:true});
  action?.closest('.kanban-card')?.scrollIntoView({block:'nearest',inline:'nearest'});
}



function backlogContent() {
  const items=rankItems(backlogItems());
  const indexed=new Map(items.map(item=>[item.id,item]));
  const byParent=new Map();
  for (const item of items) {
    if (!byParent.has(item.parent)) byParent.set(item.parent,[]);
    byParent.get(item.parent).push(item);
  }
  const childrenOf=(id)=>byParent.get(id)||[];
  const ancestry=new Map(items.map(item=>[item.id,ancestors(item,id=>indexed.get(id))]));
  const matches=new Set(items.filter(item=>workItemMatches(item,ancestry.get(item.id))).map(x=>x.id));
  const filtered=!!ui.backlogQuery.trim() || ui.backlogStatus!=='Alle' || ui.backlogPriority!=='Alle';
  if (ui.backlogView==='Board') return kanbanBoard(items,matches,filtered);
  const count=items.filter(item=>(ui.backlogFocus==='Alle'||item.type===ui.backlogFocus)&&matches.has(item.id)).length;
  const heading=backlogResultHeading(ui.backlogFocus==='Alle'?'Backlog-Hierarchie':backlogLevels.find(([key])=>key===ui.backlogFocus)?.[1]||'Backlog',count,filtered&&items.length>0);
  let rows=[];
  if (ui.backlogFocus!=='Alle') {
    rows=items.filter(x=>x.type===ui.backlogFocus).flatMap((x,i)=>matches.has(x.id)?[workItemRow(x,0,i+1,childrenOf(x.id),ancestry.get(x.id))]:[]);
  } else {
    const context=new Set();
    items.filter(x=>matches.has(x.id)).forEach(x=>ancestry.get(x.id).forEach(parent=>context.add(parent.id)));
    function traverse(parent,depth) {
      childrenOf(parent).forEach((x,i)=>{
        if (!matches.has(x.id) && !context.has(x.id)) return;
        rows.push(workItemRow(x,depth,i+1,childrenOf(x.id),ancestry.get(x.id),!matches.has(x.id),filtered));
        if (filtered || !ui.collapsed.has(x.id)) traverse(x.id,depth+1);
      });
    }
    traverse(null,0);
  }
  if (!rows.length) return heading+panel(`<div class="between"><p>${items.length?'Keine Einträge in dieser Auswahl.':'Beginne mit einem Epic und lege darunter ein Feature an.'}</p>${!items.length?btn('Epic anlegen','new-epic',{style:'small',symbol:'add'}):!filtered?btn('Alle Ebenen anzeigen','backlog-clear',{style:'small'}):''}</div>`);
  const headings=[...(ui.backlogFocus==='Alle'?[]:['Rang']),'Backlog-Eintrag','Verantwortlich','Status','Priorität',...(ui.backlogDelivery?['Factory','Fachlich']:[]),'Aktionen'];
  return heading+`<div class="backlog-table">${table('Backlog-Hierarchie',headings,rows.join(''))}</div>`;
}

function backlog() {
  const isTree=ui.backlogView==='Baum';
  if (ui.backlogFoldInitializedFor!==project().id) {
    project().useCases.filter(item=>workFor(item.id).length).forEach(item=>ui.collapsed.add(item.id));
    ui.backlogFoldInitializedFor=project().id;
  }
  const view = (label,key,symbol) => `<button type="button" class="backlog-view-tab" data-action="backlog-view" data-id="${key}" aria-pressed="${ui.backlogView===key}">${icon(symbol)}${label}</button>`;
  const navigation=`<div class="backlog-switch" role="group" aria-label="Ansicht wählen">${view('Board','Board','board')}${view('Liste','Baum','backlog')}${view('NFRs','NFRs','checkCircle')}${view('Deliverables','Deliverables','file')}</div>`;
  if (ui.backlogView==='NFRs') return nfrView(navigation);
  if (ui.backlogView==='Deliverables') return deliverableView(navigation);
  const filter = (name,change,options,current) => `<label class="backlog-control"><span class="backlog-sr">${name}</span><select data-change="${change}">${selectOptions(options,current)}</select></label>`;
  const level = filter('Ebene','backlog-focus',backlogLevels,ui.backlogFocus);
  const priority = filter('Priorität','backlog-priority',[['Alle','Alle Prioritäten'],...priorityOptions],ui.backlogPriority);
  const statuses = isTree ? pbiStages.map(s=>[s.value,s.value]) : pbiStageOptions;
  const status = filter('Status','backlog-filter',[['Alle','Alle Status'],...statuses],ui.backlogStatus);
  const sortHelp=ui.backlogFocus==='Alle'
    ? 'Ziehe einen Eintrag zwischen zwei Einträge derselben Ebene oder auf den gewünschten übergeordneten Eintrag.'
    : 'Ziehe einen Eintrag zwischen zwei Zeilen, um seinen Rang auf dieser Ebene zu ändern.';
  const listSettings = isTree ? `<div class="backlog-list-options"><label class="backlog-delivery"><input type="checkbox" data-change="backlog-delivery"${ui.backlogDelivery?' checked':''}> Lieferstatus</label>${ui.backlogUndo?.project===project().id?btn('Rückgängig','backlog-undo',{symbol:'undo',style:'small quiet',title:'Letzte Änderung an Anordnung oder Priorität zurücknehmen'}):''}</div>` : '';
  return title('Backlog') + `<div class="backlog-workspace">
    <section class="backlog-navigation" aria-label="Backlog-Ansichten">${navigation}
      ${btn('Neuer Eintrag','backlog-new',{style:'primary',symbol:'add'})}</section>
    <section class="backlog-toolbar" aria-label="Backlog filtern"><label class="backlog-search-field">${icon('search')}<span class="backlog-sr">Backlog durchsuchen</span><input type="search" id="backlog-search" value="${e(ui.backlogQuery)}" placeholder="Titel, ID oder Thema suchen" data-input="backlog"></label>
      <div class="backlog-filter-fields">${isTree?level:''}${priority}${status}</div>${listSettings}</section>
    <div id="backlog-results">${backlogContent()}</div>
    ${isTree?`<details class="backlog-help" id="backlog-help"><summary>Einträge anordnen</summary><p>${sortHelp} Über den Griff am Zeilenende kannst du die Anordnung auch per Klick oder Tastatur ändern.</p></details>`:''}</div>`;
}

const deliverableStatuses=['Geplant','In Arbeit','In Prüfung','Erledigt'];

function projectDeliverables() {
  return project().deliverables||[];
}

function deliverableRecord(id) {
  return projectDeliverables().find(record=>record.id===id);
}

function deliverableMatches(record) {
  const note=record.docId&&getDoc(record.docId);
  const type=record.kind||note?.kind||'';
  if (ui.deliverableStatus&&record.status!==ui.deliverableStatus) return false;
  if (ui.deliverableKind&&(ui.deliverableKind==='untyped'?!!type:type!==ui.deliverableKind)) return false;
  const query=(ui.deliverableQuery||'').trim().toLocaleLowerCase('de');
  return [record.id,record.title,record.outcome,record.owner,record.status,record.due,type,note?.title,note?.id].filter(Boolean).join(' ').toLocaleLowerCase('de').includes(query);
}

function deliverableNoteOptions(kind,selected='') {
  const all=project().docs.filter(note=>!kind||note.kind===kind||note.id===selected);
  const options=[['','Keine Notiz verknüpft'],...all.map(note=>[note.id,`${note.title} · ${note.kind} · ${note.id}`])];
  if (selected&&!getDoc(selected)) options.push([selected,`${selected} · Verweis nicht verfügbar`]);
  return selectOptions(options,selected);
}

function deliverableRelated(docId) {
  const items=projectDeliverables().filter(record=>record.docId===docId);
  return items.length?`<section class="deliverable-references" aria-label="Deliverables"><h2>Deliverables</h2><div class="linked-items">${items.map(record=>link(`${record.id} · ${record.title}`,'deliverable-focus',record.id,'checkCircle')).join('')}</div></section>`:'';
}

function deliverableForm(id='',focusDocument=false) {
  const record=id?deliverableRecord(id):null;
  if (id&&!record) return;
  const fields=storyHidden('sourceProject',project().id)+storyHidden('id',id)+
    input('title','Titel',record?.title||'','required autofocus maxlength="150"')+
    area('outcome','Erwartetes Ergebnis',record?.outcome||'','required placeholder="Woran erkennt ihr, dass die Lieferung vollständig ist?"')+
    `<div class="form-grid">${choose('status','Status',deliverableStatuses,record?.status||'Geplant','required')}${backlogOwnerField(record?.owner||'')}</div>`+
    `<div class="form-grid"><label>Fällig am<input type="date" name="due" value="${e(record?.due||'')}"></label>${choose('kind','Dokumentvorlage',[['','Ohne feste Vorlage'],...docKinds],record?.kind||'','data-change="deliverable-kind"')}</div>`+
    `<label>Verknüpfte Wissensnotiz<select name="docId">${deliverableNoteOptions(record?.kind||'',record?.docId||'')}</select></label><p class="field-error" id="deliverable-error" role="alert" hidden></p>`;
  showDialog(record?`${record.id} bearbeiten`:'Deliverable anlegen',form('deliverable-record',fields,'Deliverable speichern'));
  if (focusDocument) $('dialog').querySelector('[name="docId"]').focus();
}

function deliverableRow(record) {
  const note=record.docId&&getDoc(record.docId);
  const template=record.kind||note?.kind;
  const noteControl=note?`<div>${link(note.title,'open-doc',note.id,'file')}<small>${e(note.id)}${template?' · '+e(template):''}</small></div>${iconBtn('Notizverknüpfung bearbeiten','deliverable-link','edit',record.id)}`:
    `<div><small>${record.docId?e(record.docId)+' · Verweis nicht verfügbar':template?e(template)+' vorgesehen':'Keine Notiz verknüpft'}</small><div class="deliverable-links">${link('Notiz verknüpfen','deliverable-link',record.id,'link')}${link('Notiz anlegen','deliverable-create-doc',record.id,'add')}</div></div>`;
  const due=record.due?`<span>Fällig <time datetime="${e(record.due)}">${e(record.due.split('-').reverse().join('.'))}</time></span>`:'';
  return `<li data-deliverable-id="${e(record.id)}"><div class="deliverable-summary"><small>${e(record.id)}</small>${link(record.title,'deliverable-edit',record.id)}<p>${e(record.outcome)}</p></div>
    <div class="deliverable-note">${noteControl}</div><div class="deliverable-state"><select data-change="deliverable-status" data-id="${e(record.id)}" aria-label="Status von ${e(record.id)}">${selectOptions(deliverableStatuses,record.status||'Geplant')}</select>
    <small>${e(record.owner||'Nicht zugewiesen')}${due?' · ':''}${due}</small></div></li>`;
}

function deliverableResults() {
  const all=projectDeliverables(),visible=all.filter(deliverableMatches);
  const filtered=!!(ui.deliverableQuery||ui.deliverableKind||ui.deliverableStatus);
  const summary=`<div class="deliverable-count"><span role="status">${filtered?`${visible.length} von ${all.length}`:all.length} ${all.length===1?'Deliverable':'Deliverables'}</span>${filtered?btn('Filter zurücksetzen','deliverable-clear',{symbol:'undo',style:'small quiet'}):''}</div>`;
  return summary+(visible.length?`<div class="panel deliverable-register"><div class="deliverable-columns" aria-hidden="true"><span>Ergebnis</span><span>Wissensnotiz</span><span>Bearbeitungsstand</span></div><ul>${visible.map(deliverableRow).join('')}</ul></div>`:
    panel(empty(all.length?'Keine Deliverables für diese Auswahl.':'In diesem Projekt sind noch keine Deliverables geplant.')));
}

function deliverableView(navigation) {
  const filter=(id,label,options,value)=>`<div><label for="${id}">${label}</label><select id="${id}" data-change="${id}">${selectOptions(options,value||'')}</select></div>`;
  return title('Backlog')+`<div class="backlog-workspace deliverable-workspace"><section class="backlog-navigation" aria-label="Backlog-Ansichten">${navigation}${btn('Deliverable anlegen','deliverable-new',{symbol:'add',style:'primary'})}</section>
    <div class="deliverable-heading"><h2>Deliverables</h2><p>Lieferergebnisse, Termine und die zugehörigen Wissensnotizen.</p></div>
    <section class="deliverable-filters" aria-label="Deliverables filtern"><div><label for="deliverable-search">Deliverables durchsuchen</label><input type="search" id="deliverable-search" data-input="deliverable-search" placeholder="Titel, Kennung oder Notiz" value="${e(ui.deliverableQuery||'')}"></div>
    ${filter('deliverable-status-filter','Status filtern',[['','Alle Status'],...deliverableStatuses],ui.deliverableStatus)}
    ${filter('deliverable-kind-filter','Vorlage filtern',[['','Alle Vorlagen'],['untyped','Ohne Vorlage'],...docKinds],ui.deliverableKind)}</section>
    <div id="deliverable-results">${deliverableResults()}</div></div>`;
}

function saveDeliverable(el,vals) {
  const p=project();
  if (p.id!==vals.sourceProject) return;
  const existing=vals.id?deliverableRecord(vals.id):null;
  if (vals.id&&!existing) return;
  const note=vals.docId&&getDoc(vals.docId);
  const sameMissing=existing?.docId===vals.docId&&(existing?.kind||'')===vals.kind;
  if (!deliverableStatuses.includes(vals.status)||(vals.kind&&!docKinds.includes(vals.kind))) return;
  if ((vals.docId&&!note&&!sameMissing)||(note&&vals.kind&&note.kind!==vals.kind)) {
    const error=$('deliverable-error');
    error.hidden=false;error.textContent='Wähle eine Notiz der gewünschten Vorlage oder löse die bisherige Verknüpfung.';
    const control=el.elements.namedItem('docId');control.setAttribute('aria-describedby',error.id);control.focus();return;
  }
  const record=existing||{id:nextId('DEL',projectDeliverables())};
  Object.assign(record,{title:vals.title,outcome:vals.outcome,owner:vals.owner||'',due:vals.due||'',status:vals.status,kind:vals.kind||'',docId:vals.docId||''});
  if (!existing) (p.deliverables||=[]).push(record);
  if (!deliverableMatches(record)) {ui.deliverableQuery='';ui.deliverableKind='';ui.deliverableStatus='';}
  hideDialog();flash(`${record.id} gespeichert`);
  $('workspace').querySelector(`[data-action="deliverable-edit"][data-id="${CSS.escape(record.id)}"]`)?.focus({preventScroll:true});
}

function deliverableAction(key,id) {
  if (key==='deliverable-new') {deliverableForm();return;}
  if (key==='deliverable-clear') {ui.deliverableQuery='';ui.deliverableKind='';ui.deliverableStatus='';render();$('deliverable-search')?.focus();return;}
  const record=deliverableRecord(id);
  if (!record) return;
  if (key==='deliverable-create-doc') {
    if (getDoc(record.docId)) {go('doc',record.docId);return;}
    newDoc(record.kind||'PRD',{deliverableId:id});
  } else if (key==='deliverable-focus') {
    if (!deliverableMatches(record)) {ui.deliverableQuery='';ui.deliverableKind='';ui.deliverableStatus='';}
    go('backlog','deliverables');deliverableForm(id);
  } else if (key==='deliverable-edit'||key==='deliverable-link') deliverableForm(id,key==='deliverable-link');
}

function deliverableChange(key,el) {
  if (key==='deliverable-kind') {
    const select=el.form.elements.namedItem('docId');
    select.innerHTML=deliverableNoteOptions(el.value,select.value);
    return;
  }
  if (key==='deliverable-status') {
    const record=deliverableRecord(el.dataset.id);
    if (!record||!deliverableStatuses.includes(el.value)) return;
    record.status=el.value;persist();
    $('deliverable-results').innerHTML=deliverableResults();
    ($('workspace').querySelector(`[data-change="deliverable-status"][data-id="${CSS.escape(record.id)}"]`)||$('deliverable-status-filter')).focus({preventScroll:true});
    toast('Status gespeichert');return;
  }

  if (key==='deliverable-kind-filter') ui.deliverableKind=el.value;
  $('deliverable-results').innerHTML=deliverableResults();
}


const nfrStandards=[
  {id:'25010',name:'ISO/IEC 25010:2023',scope:'Produktqualität',description:'Neun Merkmale beschreiben, welche Eigenschaften ein digitales Produkt unter bestimmten Bedingungen zeigen soll.',source:'https://www.iso.org/standard/78176.html'},
  {id:'27001',name:'ISO/IEC 27001:2022',scope:'Informationssicherheit · Anhang A',description:'Vier Themen ordnen die Referenzmaßnahmen in Anhang A. Welche Maßnahmen erforderlich sind, ergibt sich aus der Risikobehandlung der Organisation.',source:'https://www.iso.org/standard/27001'}
];
const nfrCategories=[
  {id:'functional-suitability',label:'Funktionale Eignung',standard:'25010'},
  {id:'performance-efficiency',label:'Leistungseffizienz',standard:'25010'},
  {id:'compatibility',label:'Kompatibilität',standard:'25010'},
  {id:'interaction-capability',label:'Interaktionsfähigkeit',standard:'25010'},
  {id:'reliability',label:'Zuverlässigkeit',standard:'25010'},
  {id:'security',label:'Informationssicherheit',standard:'25010'},
  {id:'maintainability',label:'Wartbarkeit',standard:'25010'},
  {id:'flexibility',label:'Flexibilität',standard:'25010'},
  {id:'safety',label:'Schutz vor Schäden (Safety)',standard:'25010'},
  {id:'organizational',label:'Organisatorische Maßnahmen',standard:'27001'},
  {id:'people',label:'Personenbezogene Maßnahmen',standard:'27001'},
  {id:'physical',label:'Physische Maßnahmen',standard:'27001'},
  {id:'technological',label:'Technische Maßnahmen',standard:'27001'}
];

function projectNfrs(p=project()) {
  return p.nfrs??=[];
}

function nfrTargetRecord(kind,id) {
  if (kind==='item') return backlogItem(id);
  if (kind==='map') return projectStoryMaps().find(map=>map.id===id);
}

function directNfrs(kind,id) {
  if (!nfrTargetRecord(kind,id)) return [];
  return projectNfrs().filter(nfr=>nfr.targets?.some(target=>target.kind===kind && target.id===id));
}

function replaceNfrTargets(nfr,targets) {
  if (!nfr || !Array.isArray(targets)) return false;
  const stored=projectNfrs().find(record=>record.id===nfr.id);
  if (stored && stored!==nfr) return false;
  if (!stored && state.projects.some(other=>other!==project() && other.nfrs?.includes(nfr))) return false;
  const unique=new Map();
  for (const target of targets) {
    if (!target || !nfrTargetRecord(target.kind,target.id)) return false;
    unique.set(target.kind+':'+target.id,{kind:target.kind,id:target.id});
  }
  nfr.targets=[...unique.values()];
  return true;
}

function setTargetNfrs(kind,id,nfrIds) {
  if (!nfrTargetRecord(kind,id) || !Array.isArray(nfrIds)) return false;
  const records=projectNfrs();
  const selected=new Set(nfrIds);
  const known=new Set(records.map(record=>record.id));
  if ([...selected].some(key=>!known.has(key))) return false;
  for (const nfr of records) {
    const refs=nfr.targets || [];
    const linked=refs.some(ref=>ref.kind===kind && ref.id===id);
    if (!linked && selected.has(nfr.id)) nfr.targets=[...refs,{kind,id}];
    if (linked && !selected.has(nfr.id)) nfr.targets=refs.filter(ref=>ref.kind!==kind || ref.id!==id);
  }
  return true;
}

function productScopeOrigins(kind,source) {
  const id=source.id;
  const origins=new Map();
  const add=(kind,item)=>origins.set(kind+':'+item.id,{kind,id:item.id,title:item.title});
  const items=backlogItems();
  const byId=new Map(items.map(item=>[item.id,item]));
  const lineage=item=>ancestors(item,key=>byId.get(key));
  const addItemAndParents=item=>{
    add('item',item);
    for (const parent of lineage(item)) add('item',parent);
  };
  const linkedIds=map=>new Set(map.cards.flatMap(card=>(card.links||[])
    .filter(ref=>ref.projectId===project().id && byId.has(ref.itemId)).map(ref=>ref.itemId)));
  if (kind==='map') {
    add('map',source);
    for (const key of linkedIds(source)) {
      const item=byId.get(key);
      addItemAndParents(item);
      if (item.type==='PBI') for (const child of workFor(key)) add('item',child);
    }
  } else if (kind==='item') {
    addItemAndParents(source);
    const mapItems=new Set([id]);
    for (const item of items) {
      if (!lineage(item).some(parent=>parent.id===id)) continue;
      add('item',item);
      mapItems.add(item.id);
    }
    // Work under a mapped PBI belongs to that journey. A shared Epic alone does not establish a map link.
    if (byId.get(source.parent)?.type==='PBI') mapItems.add(source.parent);
    for (const map of projectStoryMaps()) {
      if ([...linkedIds(map)].some(key=>mapItems.has(key))) add('map',map);
    }
  }
  return origins;
}

function nfrsForScope(kind,id) {
  const records=projectNfrs();
  const source=kind==='nfr'?records.find(record=>record.id===id):nfrTargetRecord(kind,id);
  if (!source) return [];
  const origins=productScopeOrigins(kind,source);
  const result=[];
  for (const nfr of records) {
    const matches=new Map();
    for (const ref of nfr.targets || []) {
      const key=ref.kind+':'+ref.id;
      if (origins.has(key)) matches.set(key,origins.get(key));
    }
    if (kind==='nfr' && nfr.id===id) matches.set('nfr:'+id,{kind,id,title:nfr.title});
    if (!matches.size) continue;
    const sources=[...matches.keys()].sort().map(key=>matches.get(key));
    result.push({id:nfr.id,title:nfr.title,requirement:nfr.requirement || '',acceptance:nfr.acceptance || '',
      categories:[...new Set(nfr.categories || [])].sort(),sources});
  }
  return result.sort((a,b)=>a.id.localeCompare(b.id));
}


function matchesNfr(record) {
  const assigned=nfrCategories.filter(category=>(record.categories||[]).includes(category.id));
  const filter=ui.nfrFilter||'';
  const term=(ui.nfrQuery||'').trim().toLocaleLowerCase('de');
  const matchesCategory=!filter||(filter==='unmapped'?!assigned.length:assigned.some(category=>category.id===filter||category.standard===filter));
  return matchesCategory&&[record.id,record.title,record.requirement,record.acceptance,record.owner,...assigned.map(category=>category.label)].join(' ').toLocaleLowerCase('de').includes(term);
}

function nfrResults() {
  const all=projectNfrs();
  const records=all.filter(matchesNfr);
  const reset=(ui.nfrQuery||ui.nfrFilter)?btn('Filter zurücksetzen','nfr-clear',{style:'small quiet',symbol:'undo'}):'';
  const rows=records.map(record=>{
    const assigned=nfrCategories.filter(category=>(record.categories||[]).includes(category.id));
    const labels=nfrStandards.map(standard=>{
      const names=assigned.filter(category=>category.standard===standard.id).map(category=>category.label);
      if (!names.length) return '';
      const groupName=standard.id==='27001'?'ISO/IEC 27001 · Anhang A':'ISO/IEC 25010';
      return `<div class="nfr-class-group"><small>${groupName}</small><span>${e(names.join(' · '))}</span></div>`;
    }).join('');
    return `<li><div><small>${e(record.id)}</small>${link(record.title,'nfr-edit',record.id)}<p>${e(record.requirement)}</p></div><div class="nfr-classification">${labels||'Noch nicht zugeordnet'}</div><div class="nfr-owner">${e(record.owner||'Nicht zugewiesen')}</div></li>`;
  }).join('');
  return `<div class="nfr-count"><span role="status">${records.length} von ${all.length} NFRs</span>${reset}</div>`+(rows?`<div class="panel nfr-register"><div class="nfr-list-head" aria-hidden="true"><span>Anforderung</span><span>Kategorien</span><span>Verantwortlich</span></div><ul>${rows}</ul></div>`:panel(empty(all.length?'Keine NFRs für diese Auswahl.':'In diesem Projekt sind noch keine NFRs erfasst.')));
}

function nfrView(navigation) {
  const selected=ui.nfrFilter||'';
  const groups=nfrStandards.map(standard=>`<optgroup label="${e(standard.name)} · ${e(standard.scope)}">${selectOptions([[standard.id,`Alle Kategorien · ${standard.name}`],...nfrCategories.filter(category=>category.standard===standard.id).map(category=>[category.id,category.label])],selected)}</optgroup>`).join('');
  const filters=`<section class="nfr-filters" aria-label="NFRs filtern"><div><label for="nfr-search">NFRs durchsuchen</label><input type="search" id="nfr-search" data-input="nfr-search" value="${e(ui.nfrQuery||'')}" placeholder="Titel, ID oder Inhalt"></div><div><label for="nfr-filter">Norm oder Kategorie</label><select id="nfr-filter" data-change="nfr-filter">${selectOptions([['','Alle Kategorien'],['unmapped','Noch nicht zugeordnet']],selected)}${groups}</select></div></section>`;
  const standards=`<details class="nfr-reference"><summary>Einordnung der Normen</summary>${nfrStandards.map(standard=>`<p><strong>${e(standard.scope)}.</strong> ${e(standard.description)} <a href="${standard.source}" target="_blank" rel="noopener noreferrer">${e(standard.name)}</a></p>`).join('')}<p>Die Zuordnung dokumentiert den fachlichen Bezug einer Anforderung. Der Nachweis ihrer Erfüllung erfolgt separat.</p></details>`;
  return title('Backlog')+`<div class="backlog-workspace nfr-workspace"><section class="backlog-navigation" aria-label="Backlog-Ansichten">${navigation}<div class="inline wrap">${btn('NFRs importieren','nfr-import',{symbol:'file'})}${btn('NFR anlegen','nfr-new',{style:'primary',symbol:'add'})}</div></section><div class="nfr-intro"><h2>Nichtfunktionale Anforderungen</h2><p>Qualitätsziele und Sicherheitsanforderungen mit prüfbaren Abnahmekriterien.</p></div>${filters}<div id="nfr-results">${nfrResults()}</div>${standards}</div>`;
}

function splitNfrTarget(value) {
  const separator=value.indexOf(':');
  return {kind:value.slice(0,separator),id:value.slice(separator+1)};
}

function nfrTargetFields(record) {
  const assigned=Array.isArray(record?.targets)?record.targets:[];
  const selected=new Set(assigned.map(ref=>ref.kind+':'+ref.id));
  const chosen=assigned.map(ref=>{
    const item=nfrTargetRecord(ref.kind,ref.id);
    return item?`<li>${link(`${item.id} · ${item.title}`,'nfr-open-target',ref.kind+':'+item.id,ref.kind==='map'?'board':'backlog')}</li>`:
      `<li class="muted">${e(ref.id)} · Ziel nicht gefunden</li>`;
  }).join('');
  const group=(label,kind,items)=>items.length?`<div class="nfr-link-group"><h4>${e(label)}</h4>${items.map(item=>{
    const value=kind+':'+item.id;
    return `<label><input type="checkbox" name="nfrTarget" value="${e(value)}"${selected.has(value)?' checked':''}><span>${e(item.id)} · ${e(item.title)}</span></label>`;
  }).join('')}</div>`:'';
  const items=rankItems(backlogItems());
  const groups=[group('Story Maps','map',projectStoryMaps()),...[...backlogKinds,...workTypes].map(type=>group(backlogLevels.find(([key])=>key===type)?.[1]||type,'item',items.filter(item=>item.type===type)))].join('');
  const missing=assigned.filter(ref=>!nfrTargetRecord(ref.kind,ref.id)).map(ref=>`<label><input type="checkbox" name="nfrTarget" value="${e(ref.kind+':'+ref.id)}" checked><span>${e(ref.id)} · Ziel nicht gefunden</span></label>`).join('');
  return `<fieldset class="nfr-target-fields"><legend>Gilt für</legend>${chosen?`<ul class="nfr-linked-list">${chosen}</ul>`:''}
    ${groups||missing?`<details><summary>Zuordnungen auswählen</summary><div class="nfr-target-options">${groups}${missing?`<div class="nfr-link-group"><h4>Fehlende Ziele</h4>${missing}</div>`:''}</div></details>`:'<p class="muted">In diesem Projekt gibt es noch keine Backlog-Einträge oder Story Maps.</p>'}</fieldset>`;
}

function nfrSourceSection(kind,id) {
  const records=directNfrs(kind,id);
  const key=kind+':'+id;
  const entries=records.map(record=>`<li>${link(record.title,'nfr-open-record',record.id,'link')}<small>${e(record.id)}</small></li>`).join('');
  return `<section class="source-prototypes source-nfr" data-nfr-source="${e(key)}" aria-label="Direkte NFR-Zuordnungen für ${e(id)}"><div class="source-proto-head"><h3>Nichtfunktionale Anforderungen${records.length?` <span>${records.length}</span>`:''}</h3>
    ${btn('NFRs zuordnen','nfr-source-assign',{id:key,style:'small quiet',symbol:'link'})}</div>${entries?`<ul class="source-proto-list">${entries}</ul>`:''}</section>`;
}

function nfrAssignmentDialog(value) {
  const {kind,id}=splitNfrTarget(value);
  const target=nfrTargetRecord(kind,id);
  if(!target)return;
  const records=projectNfrs();
  const assigned=new Set(directNfrs(kind,id).map(record=>record.id));
  const options=records.map((record,index)=>`<label class="nfr-pick"><input type="checkbox"${index===0?' autofocus':''} aria-label="${e(record.id+' · '+record.title)}" name="nfrId" value="${e(record.id)}"${assigned.has(record.id)?' checked':''}><span><strong>${e(record.title)}</strong><small>${e(record.id)}</small><span>${e(record.requirement)}</span><span class="muted">Abnahmekriterium · ${e(record.acceptance)}</span></span></label>`).join('');
  const fields=storyHidden('projectId',project().id)+storyHidden('target',value)+`<p>${e(target.id)} · <strong>${e(target.title)}</strong></p><fieldset class="nfr-pick-list"><legend>NFRs dieses Projekts</legend>${options}</fieldset>`;
  const emptyState=`<p class="muted">In diesem Projekt sind noch keine NFRs angelegt.</p><div class="space-top">${btn('Schließen','close-dialog')}</div>`;
  sourceChildDialog('NFRs zuordnen',records.length?form('nfr-source-assign',fields,'Zuordnung speichern'):emptyState,'nfr-target-picker');

function saveTargetAssignments(el,vals) {
  if(vals.projectId!==project().id)return;
  const {kind,id}=splitNfrTarget(vals.target);
  const ids=new FormData(el).getAll('nfrId');
  if(!setTargetNfrs(kind,id,ids)){toast('Die Auswahl ist nicht mehr verfügbar. Öffne die Zuordnung erneut.');return;}
  persist();
  el.closest('dialog').close();
  const selector=`[data-nfr-source="${CSS.escape(vals.target)}"]`;
  for(const section of document.querySelectorAll(selector))section.outerHTML=nfrSourceSection(kind,id);
  const owner=$('dialog').open?$('dialog'):$('workspace');
  owner.querySelector(`${selector} [data-action="nfr-source-assign"]`)?.focus({preventScroll:true});
  toast('NFR-Zuordnung gespeichert');
}

function openLinkedDestination(value,confirmed=false) {
  const {kind,id}=splitNfrTarget(value);
  const target=kind==='nfr'?projectNfrs().find(record=>record.id===id):kind==='entity'?
    project().docs.find(record=>record.id===id&&record.kind==='Entität'):kind==='prd'?entityTargetRecord(kind,id):nfrTargetRecord(kind,id);
  if(!target){toast('Das verknüpfte Ziel ist nicht mehr verfügbar.');return;}
  const dirty=activeDirtyEditor()||($('dialog').open&&$('dialog').querySelector('form[data-source-changed="true"]'));
  if(!confirmed&&dirty) {
    sourceChildDialog('Ungespeicherte Änderungen',`<div class="stack"><p>Der aktuelle Entwurf enthält ungespeicherte Änderungen.</p><div class="inline wrap">${btn('Weiter bearbeiten','close-dialog',{style:'primary'})}${btn('Verwerfen und öffnen','linked-discard-open',{id:value,style:'danger'})}</div></div>`,'linked-navigation-confirm');
    return;
  }
  $('linked-navigation-confirm')?.close();
  if(kind==='nfr'){go('backlog','nfrs');nfrForm(id);}
  else if(kind==='entity')go(target.domainArchived?'doc':'domainmodel',id);
  else if(kind==='prd')go('doc',id);
  else if(kind==='map')go('storymap',id);
  else if(target.type==='PBI')go('usecase',id);
  else {
    go('backlog');
    if(workTypes.includes(target.type))workForm(target.parent,target.type,target);
    else editBacklog(id);
  }
}

function entityScopeEntries(kind,id) {
  if(kind!=='entity')return entitiesLinkedToTarget(kind,id).map(note=>({
    key:'entity:'+note.id,record:note,label:note.domainArchived?'Archiviert':'Entität'
  }));
  const note=getDoc(id);
  const entries=new Map();
  for(const ref of note?.domainTargets||[]) {
    const key=ref.kind+':'+ref.id;
    const record=entityTargetRecord(ref.kind,ref.id);
    entries.set(key,{key,record,label:ref.kind==='prd'?'PRD':ref.kind==='map'?'Story Map':record?.type||'Backlog-Eintrag'});
  }
  return [...entries.values()];
}

function entityScopeSection(kind,id) {
  const source=kind==='entity';
  const records=entityScopeEntries(kind,id),key=kind+':'+id;
  const heading=source?'Produktumfang':'Entitäten im Domainmodel';
  const action=source?'Produktumfang zuordnen':'Entitäten zuordnen';
  const links=records.map(({key,record,label})=>record?
    `<li>${link(record.title,'entity-scope-open',key,'link')}<small>${e(record.id)} · ${e(label)}</small></li>`:
    `<li class="muted">${e(splitNfrTarget(key).id)} · Ziel nicht gefunden</li>`).join('');
  return `<section class="entity-scope" data-entity-scope="${e(key)}" aria-label="${heading} für ${e(id)}"><div class="source-proto-head"><h3>${heading}${records.length?` <span>${records.length}</span>`:''}</h3>
    ${btn(action,'entity-scope-edit',{id:key,style:'small quiet',symbol:'link'})}</div>${links?`<ul class="source-proto-list">${links}</ul>`:''}</section>`;
}

function entityScopeDialog(value) {
  const {kind,id}=splitNfrTarget(value),source=kind==='entity';
  const record=source?getDoc(id):entityTargetRecord(kind,id);
  if(!record||(source&&record.kind!=='Entität'))return;
  const existing=entityScopeEntries(kind,id);
  const selected=new Set(existing.map(entry=>entry.key));
  const group=(label,options)=>options.length?`<div class="nfr-link-group"><h4>${e(label)}</h4>${options.map(({key,title})=>`<label><input type="checkbox" name="scopeChoice" value="${e(key)}"${selected.has(key)?' checked':''}><span>${e(splitNfrTarget(key).id)} · ${e(title)}</span></label>`).join('')}</div>`:'';
  const choices=(kind,items)=>items.map(item=>({key:kind+':'+item.id,title:item.title}));
  let groups;
  if(source&&!record.domainArchived) {
    const items=rankItems(backlogItems());
    groups=group('Produktanforderungen',choices('prd',project().docs.filter(d=>d.kind==='PRD')))+
      group('Story Maps',choices('map',projectStoryMaps()))+
      [...backlogKinds,...workTypes].map(type=>group(backlogLevels.find(([key])=>key===type)?.[1]||type,choices('item',items.filter(item=>item.type===type)))).join('');
  }else if(source){
    groups=group('Bestehende Zuordnungen',existing.filter(entry=>entry.record).map(entry=>({key:entry.key,title:entry.record.title})));
  }else{
    groups=group('Aktive Entitäten',choices('entity',domainEntities()))+
      group('Archivierte Zuordnungen',existing.filter(entry=>entry.record?.domainArchived).map(entry=>({key:entry.key,title:entry.record.title})));
  }
  if(source)groups+=group('Fehlende Ziele',existing.filter(entry=>!entry.record).map(entry=>({key:entry.key,title:'Ziel nicht gefunden'})));
  const heading=source?'Produktumfang zuordnen':'Entitäten zuordnen';
  const context=`<p>${e(id)} · <strong>${e(record.title)}</strong></p>`;
  const fields=storyHidden('projectId',project().id)+storyHidden('subject',value)+context+
    `<fieldset class="nfr-target-fields"><legend tabindex="-1" autofocus>${source?'Zugehörige PRDs, Story Maps und Backlog-Einträge':'Entitäten dieses Projekts'}</legend><div class="nfr-target-options">${groups}</div></fieldset>`;
  const emptyMessage=source?(record.domainArchived?'Die archivierte Entität hat keine bestehenden Zuordnungen.':'In diesem Projekt gibt es noch keine PRDs, Story Maps oder Backlog-Einträge.'):'Im Domainmodel dieses Projekts sind noch keine aktiven Entitäten angelegt.';
  sourceChildDialog(heading,groups?form('entity-scope-assign',fields,'Zuordnung speichern'):context+empty(emptyMessage)+btn('Schließen','close-dialog'),'entity-scope-picker');
}

// Relation changes may affect the note or prototype beneath a child dialog.
// Update those readouts in place so editors, selections and the running preview survive.
function refreshScopeContext() {
  const workspace=$('workspace');
  if(ui.route==='doc') {
    const note=getDoc(ui.id);
    if(note?.kind!=='Entität')return;
    const meta=workspace.querySelector('.artifact-meta');
    if(meta)meta.outerHTML=documentStateMeta(note);
    const panel=workspace.querySelector('.artifact-document [data-git-panel]');
    if(panel){
      const current=panel.querySelector('[data-action="git-select"][aria-pressed="true"]');
      const sha=current?.dataset.id.slice(note.id.length+1)||'';
      panel.outerHTML=gitPanel(note,sha);
    }
  }else if(ui.route==='prototype') {
    const proto=getProto(ui.id),brief=workspace.querySelector('.agent-brief');
    if(!proto?.source||!brief)return;
    const status=prototypeStatus(proto);
    workspace.querySelector('.agent-status').innerHTML=prototypeStateBadge(status);
    const caption=workspace.querySelector('.agent-output > p');
    if(caption&&proto.output)caption.textContent=prototypeStateCaption(proto,status);
    const model=domainScopePanel(domainForScope(proto.source.kind,proto.source.id));
    const before=brief.querySelector('.domain-scope');
    if(before)before.outerHTML=model;
    else if(model)brief.insertAdjacentHTML('beforeend',model);
  }
}

function saveEntityScope(el,vals) {
  if(vals.projectId!==project().id)return;
  const {kind,id}=splitNfrTarget(vals.subject),source=kind==='entity';
  const record=source?getDoc(id):entityTargetRecord(kind,id);
  if(!record||(source&&record.kind!=='Entität'))return;
  const picks=[...new FormData(el).getAll('scopeChoice')].map(splitNfrTarget);
  const beforeRev=record.rev;
  const ok=source?setEntityTargets(record,picks):picks.every(pick=>pick.kind==='entity')&&setTargetEntities(kind,id,picks.map(pick=>pick.id));
  if(!ok){toast('Die Auswahl ist nicht mehr verfügbar. Öffne die Zuordnung erneut.');return;}
  const editor=$('dialog').open?$('dialog').querySelector('form[data-form="domain-entity"]'):null;
  if(source&&editor?.elements.id.value===id&&editor.elements.baseRev.value===String(beforeRev))editor.elements.baseRev.value=String(record.rev);
  persist();el.closest('dialog').close();
  for(const section of document.querySelectorAll('[data-entity-scope]')) {
    const subject=splitNfrTarget(section.dataset.entityScope);
    section.outerHTML=entityScopeSection(subject.kind,subject.id);
  }
  const owner=$('dialog').open?$('dialog'):$('workspace');
  refreshScopeContext();
  owner.querySelector(`[data-entity-scope="${CSS.escape(vals.subject)}"] [data-action="entity-scope-edit"]`)?.focus({preventScroll:true});
  toast('Zuordnung gespeichert');
}

function nfrForm(id='') {

function saveNfr(el,vals) {
  if (vals.projectId!==project().id) return;
  const records=projectNfrs();
  const existing=records.find(record=>record.id===vals.id);
  if (vals.id&&!existing) return;
  const requested=new Set(new FormData(el).getAll('category'));
  const known=nfrCategories.filter(category=>requested.has(category.id)).map(category=>category.id);
  const previous=(existing?.categories||[]).filter(key=>!nfrCategories.some(category=>category.id===key));
  const values={title:vals.title,requirement:vals.requirement,acceptance:vals.acceptance,owner:vals.owner||'',categories:[...known,...previous]};
  const record=existing||{id:nextId('NFR',records)};
  const chosen=[...new Set(new FormData(el).getAll('nfrTarget'))];
  const before=new Set((record.targets||[]).map(ref=>ref.kind+':'+ref.id));
  if(chosen.length!==before.size||chosen.some(key=>!before.has(key))) {
    if(!replaceNfrTargets(record,chosen.map(splitNfrTarget))){
      const details=el.querySelector('.nfr-target-fields details');
      if(details)details.open=true;
      toast('Ein Ziel ist nicht mehr verfügbar. Entferne die fehlende Zuordnung und speichere erneut.');
      el.querySelector('.nfr-target-fields summary')?.focus();return;
    }
  }
  Object.assign(record,values);
  if (!existing) records.push(record);
  const inCatalog=ui.route==='backlog'&&ui.id==='nfrs';
  if (inCatalog&&!matchesNfr(record)) { ui.nfrFilter=''; ui.nfrQuery=''; }
  hideDialog();
  flash(`${record.id} gespeichert`);
  if (inCatalog) [...$('workspace').querySelectorAll('[data-action="nfr-edit"]')].find(button=>button.dataset.id===record.id)?.focus({preventScroll:true});
}

  group.order=rankedPosition(backlogItems(),group,children(parent).at(-1)?.id||parent,'after');
  p.groups.push(group);

function saveBacklogEdit(vals) {
  const item=backlogItem(vals.id);
  if (!item) return;
  const parent=item.type==='Epic'?null:vals.parent;
  if (!validParent(item.type,parent)) return;
  const ranked=rankingPeers(item,parent);
  const peers=ranked.filter(peer=>peer!==item);
  const slot=Number(vals.rank)-1;
  if(!Number.isInteger(slot)||slot<0||slot>peers.length)return;
  let placement;
  if(parent!==item.parent||ranked.indexOf(item)!==slot) {
    placement={parent,anchor:peers[slot]?.id||peers.at(-1)?.id||parent,zone:peers[slot]?'before':'after'};
  }
  const patch={title:vals.title,priority:vals.priority,owner:vals.owner||''};
  const before=item.type==='PBI'?pbiBoardStage(item):item.status||'';
  if (vals.status!==before) {
    if (!backlogStatusChoices(item.type).some(([value])=>value===vals.status)) return;
    patch.status=vals.status;
    if (item.type==='PBI') patch.stageChosen=true;
  }
  if ((item.type==='Epic'||item.type==='Feature')&&(item.body||'')!==(vals.body||'')) patch.body=vals.body||'';
  hideDialog();updateBacklog(item,patch,placement);
}

function updateDraftRank(form,reset=false) {
  const item=backlogItem(form.elements.id.value);
  if (!item) return;
  const parent=item.type==='Epic'?null:form.elements.parent?.value||item.parent;
  const peers=rankingPeers(item,parent),count=peers.filter(peer=>peer!==item).length+1;
  const proposed=reset?(parent===item.parent?peers.indexOf(item)+1:count):Number(form.elements.rank.value);
  const position=Math.min(count,Math.max(1,proposed));
  form.elements.rank.value=String(position);
  form.querySelector('[data-rank-readout]').value=`Position ${position} von ${count}`;
  form.querySelector('[data-action="backlog-nudge"][data-id$=":up"]').disabled=position<=1;
  form.querySelector('[data-action="backlog-nudge"][data-id$=":down"]').disabled=position>=count;
}

function nudgeBacklog(command) {
  const form=$('dialog').querySelector('form[data-form="edit-backlog"]');
  if(!form)return;
  const [id,direction]=command.split(':');
  if (id!==form.elements.id.value||!['up','down'].includes(direction)) return;
  form.elements.rank.value=String(Number(form.elements.rank.value)+(direction==='up'?-1:1));
  updateDraftRank(form);
  form.dataset.sourceChanged='true';
  const next=form.querySelector(`[data-action="backlog-nudge"][data-id="${CSS.escape(command)}"]`);
  if(next?.disabled)form.querySelector('[data-action="backlog-nudge"]:not(:disabled)')?.focus({preventScroll:true});
}

let dragId='';
let boardDragId='';
function clearDrop() { document.querySelectorAll('[data-drop-zone]').forEach(x=>delete x.dataset.dropZone); }
function dragStart(event) {
  const card=event.target.closest('[data-board-card]');
  if (card && event.dataTransfer) {
    if (event.target.closest('select, label')) {event.preventDefault();return;}
    boardDragId=card.dataset.boardCard;
    event.dataTransfer.effectAllowed='move';
    event.dataTransfer.setData('text/plain',boardDragId);
    card.classList.add('dragging');
    return;
  }
  const grip=event.target.closest('.drag-grip[draggable]');
  if (!grip || !event.dataTransfer) return;
  dragId=grip.dataset.id;
  event.dataTransfer.effectAllowed='move';
  event.dataTransfer.setData('text/plain',dragId);
  grip.closest('tr')?.classList.add('dragging');
}
function dragPosition(event) {
  const row=event.target.closest('tr[data-backlog-id]');
  if (!row || row.dataset.context || !dragId) return null;
  const source=backlogItem(dragId);
  const target=backlogItem(row.dataset.backlogId);
  const rect=row.getBoundingClientRect();
  const ratio=(event.clientY-rect.top)/rect.height;
  const nested=validParent(source?.type,target?.id);
  const zone=nested&&ratio>=.24&&ratio<=.76?'inside':ratio<.5?'before':'after';
  const placement=locationForDrop(source,target,zone);
  return placement ? {row,zone,placement,source} : null;
}
function dragOver(event) {
  if (boardDragId) {
    const lane=event.target.closest('[data-board-stage]');
    document.querySelectorAll('[data-board-over]').forEach(el=>{if(el!==lane) delete el.dataset.boardOver;});
    if (lane) {
      event.preventDefault();
      if (event.dataTransfer) event.dataTransfer.dropEffect='move';
      lane.dataset.boardOver='';
    }
    return;
  }
  if (!dragId) return;
  const position=dragPosition(event);
  clearDrop();
  if (!position) return;
  event.preventDefault();
  if (event.dataTransfer) event.dataTransfer.dropEffect='move';
  position.row.dataset.dropZone=position.zone;
}
function dragEnd() {
  clearDrop(); dragId=''; boardDragId='';
  document.querySelectorAll('[data-board-over]').forEach(el=>delete el.dataset.boardOver);
  document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'));
}
function dropBacklog(event) {
  if (boardDragId) {
    const lane=event.target.closest('[data-board-stage]');
    const id=boardDragId;
    dragEnd();
    if (lane) {event.preventDefault(); moveBoardCard(id,lane.dataset.boardStage);}
    return;
  }
  if (!dragId) return;
  event.preventDefault();
  const position=dragPosition(event);
  dragEnd();
  if (position) updateBacklog(position.source,{},position.placement);
}


'use strict';

// Separate fenced examples before looking for prose or file references.
function markdownBlocks(value) {
  const blocks=[];
  let lines=[],fence=null;
  function finishText() {
    if(lines.length)blocks.push({text:lines.join('\n')});
    lines=[];
  }
  for(const line of String(value||'').replace(/\r\n?/g,'\n').split('\n')) {
    if(fence) {
      const closing=line.match(/^ {0,3}(`+|~+)\s*$/);
      if(closing&&closing[1][0]===fence.marker[0]&&closing[1].length>=fence.marker.length) {
        blocks.push({...fence,text:lines.join('\n'),closing:closing[1]});
        lines=[];fence=null;
      }else lines.push(line);
      continue;
    }
    const opening=line.match(/^ {0,3}(`{3,}|~{3,})(.*)$/);
    if(opening) {
      finishText();fence={marker:opening[1],info:opening[2]};
    }else if(!line.trim())finishText();
    else {
      if(/^#{1,6}\s+/.test(line))finishText();
      lines.push(line);
    }
  }
  if(fence)blocks.push({...fence,text:lines.join('\n'),closing:''});
  else finishText();
  return blocks;
}

function wikiReference(path,alias,embed,encoded=false) {
  const mark=path.indexOf('#');
  let target=(mark<0?path:path.slice(0,mark)).trim();
  let heading=mark<0?'':path.slice(mark+1).trim();
  if(encoded) {
    try {target=decodeURIComponent(target);heading=decodeURIComponent(heading);}
    catch {return null;}
    if(/^(?:[a-z][a-z\d+.-]*:|[/\\])/i.test(target))return null;
  }
  return target||heading?{target,alias,heading,embed}:null;
}

function renderWikiReference(ref) {
  const record=ref.target?vaultResolve(ref.target):null;
  const label=ref.alias||ref.target+(ref.heading?'#'+ref.heading:'');
  if(ref.target&&!record)return `<span class="vault-unresolved" data-vault-missing="${e(ref.target)}" title="${e(ref.target)} · Kein eindeutiges Ziel im Projektordner">${e(label)}</span>`;
  const attrs=`type="button" data-action="vault-inline-open" data-id="${e(ref.target)}" data-heading="${e(ref.heading)}"`;
  if(ref.embed&&record?.kind==='image') {
    const size=ref.alias.match(/^([1-9]\d{0,4})(?:x([1-9]\d{0,4}))?$/i);
    const alt=size||!ref.alias?record.title:ref.alias;
    const dimensions=size?` width="${size[1]}"${size[2]?` height="${size[2]}"`:''}`:'';
    return `<button ${attrs} class="vault-image-link" aria-label="${e(alt)} öffnen"><img data-vault-image="${e(record.path)}" alt="${e(alt)}"${dimensions}></button>`;
  }
  return `<button ${attrs} class="vault-inline-link">${e(label)}</button>`;
}

function inlineMarkdown(value,editing=false,refs=null) {
  const source=String(value);
  const token=/\\[\\`*_[\]()!#|]|(?<ticks>`+)(?!`)(?<code>[\s\S]*?)(?<!`)\k<ticks>(?!`)|(?<wiki>!?\[\[(?<inside>[^[\]\r\n]+)\]\])|(?<markdown>!?\[(?<label>[^[\]\n]*)\]\((?<url><[^>\n]+>|(?:[^()\s]|\([^()\s]*\))+)\))|https?:\/\/[^\s<>]+|\*\*(?<bold>[^*\n]+)\*\*|\*(?<italic>[^*\n]+)\*/gi;
  let out='',last=0;
  for(const match of source.matchAll(token)) {
    const data=match.groups,raw=match[0];
    out+=e(source.slice(last,match.index)).replace(/\n/g,'<br>');
    last=match.index+raw.length;
    if(data.ticks){
      out+=`<code data-code-marker="${e(data.ticks)}">${e(data.code)}</code>`;continue;
    }
    if(data.bold||data.italic) {
      const tag=data.bold?'strong':'em';
      out+=`<${tag}>${inlineMarkdown(data.bold||data.italic,editing,refs)}</${tag}>`;continue;
    }
    let ref=null;
    if(data.wiki) {
      const bar=data.inside.indexOf('|');
      ref=wikiReference(bar<0?data.inside:data.inside.slice(0,bar),bar<0?'':data.inside.slice(bar+1).trim(),raw.startsWith('!'));
    }else if(data.markdown) {
      const url=data.url.replace(/^<|>$/g,'');
      if(/^https?:\/\//i.test(url)) {
        out+=raw.startsWith('!')?e(raw):`<a href="${e(url)}" rel="noopener noreferrer" target="_blank">${e(data.label)}</a>`;continue;
      }
      ref=wikiReference(url,data.label,raw.startsWith('!'),true);
    }
    if(ref&&refs)refs.push(ref);
    out+=ref&&!editing?renderWikiReference(ref):e(raw);
  }
  return out+e(source.slice(last)).replace(/\n/g,'<br>');
}

function vaultWikilinks(markdown) {
  const refs=[];
  markdownHTML(markdown,true,refs);
  return refs;
}

function markdownHTML(value,editing=false,refs=null) {
  const inline=text=>inlineMarkdown(text,editing,refs);
  return markdownBlocks(value).map(block=>{
    if(block.marker)return refs?'':`<pre data-fence-marker="${e(block.marker)}" data-fence-info="${e(block.info)}" data-fence-end="${e(block.closing)}"><code>${e(block.text)}</code></pre>`;
    const lines=block.text.trim().split('\n');
    const heading=lines[0].match(/^(#{1,6})\s+(.+)$/);
    const h=heading?`<h${heading[1].length} data-vault-heading="${e(heading[2])}">${inline(heading[2])}</h${heading[1].length}>`:'';
    if(h)lines.shift();
    if(!lines.length)return h;
    if(lines.every(l=>/^[-*] /.test(l)))return `${h}<ul>${lines.map(l=>`<li>${inline(l.slice(2))}</li>`).join('')}</ul>`;
    if(lines.every(l=>/^\d+\. /.test(l)))return `${h}<ol start="${Number.parseInt(lines[0],10)}">${lines.map(l=>`<li>${inline(l.replace(/^\d+\. /,''))}</li>`).join('')}</ol>`;
    if(lines.every(l=>/^> ?/.test(l)))return `${h}<blockquote>${inline(lines.map(l=>l.replace(/^> ?/,'')).join('\n'))}</blockquote>`;
    return `${h}<p>${inline(lines.join('\n'))}</p>`;
  }).join('');
}

function vaultRefProperty(note) {
  const paths=note.vaultRefs || [];
  return paths.length ? 'pe-vault-links: '+JSON.stringify(paths.map(path=>'[['+path+']]')) : '';
}

function outgoingVaultReferences(note) {
  const refs=new Map();
  for (const ref of vaultWikilinks(note.body || '')) {
    const target=vaultResolve(ref.target);
    const key=(target?.path || ref.target)+'#'+(ref.heading || '');
    if (!refs.has(key)) refs.set(key,{...ref,resolved:target});
  }
  for (const path of note.vaultRefs || []) {
    const resolved=vaultResolve(path);
    const key=(resolved?.path || path)+'#';
    refs.set(key,{...(refs.get(key)||{}),target:path,resolved,stored:path});
  }
  return [...refs.values()];
}

function vaultRelationsSection(note) {
  const refs=outgoingVaultReferences(note);
  const rows=refs.map(ref=>{
    const label=ref.alias || ref.resolved?.title || ref.target || note.title;
    const suffix=ref.heading?' › '+ref.heading:'';
