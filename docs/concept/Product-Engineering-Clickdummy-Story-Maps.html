const vaultCatalogs=new WeakMap();
const vaultImageBindings=new Map();
let vaultDatabase, vaultPickerState, vaultPreviewToken;

function vaultCatalog(p=project()) {
  if (!vaultCatalogs.has(p)) vaultCatalogs.set(p,new Map());
  return vaultCatalogs.get(p);
}

function vaultCleanPath(value) {
  const path=String(value||'').trim().replace(/\\/g,'/').replace(/^\.\//,'').normalize('NFC');
  if (!path||/^(?:\/|[a-z][a-z\d+.-]*:)/i.test(path)||path.split('/').some(bit=>!bit||bit==='.'||bit==='..')) return '';
  return path;
}

function vaultFileKind(path) {
  if (/\.md$/i.test(path)) return 'markdown';
  return /\.(png|jpe?g|gif|webp|avif)$/i.test(path)?'image':'file';
}

function vaultReferenceable(path) {
  return !!path&&!/[\u0000-\u001f\u007f#|^[\]]/.test(path);
}

function vaultEntries(p=project()) {
  const records=[...p.docs.map(d=>({kind:'doc',id:d.id,title:d.title,group:d.kind==='Akteur'?`Projektwissen · ${knowledgeType(d)}`:'Projektwissen',path:`${d.id}.md`})),
    ...[...backlogItems(p),...(p.nfrs||[])].map(item=>({kind:'item',id:item.id,title:item.title,group:item.type||'NFR',path:`${item.id}.md`}))];
  const entries=new Map(records.map(entry=>[entry.path,entry]));
  for (const asset of p.vaultFiles||[]) if (!entries.has(asset.path)) entries.set(asset.path,{...asset,group:'Lokal gespeicherte Datei'});
  for (const [path,file] of vaultCatalog(p)) {
    if (entries.get(path)?.id) continue;
    const previous=entries.get(path);
    entries.set(path,{path,title:file.name,kind:previous?.kind||vaultFileKind(path),group:'Lokale Datei',file,stamp:previous?.stamp});
  }
  return [...entries.values()];
}

function vaultMatches(target,entries) {
  const value=vaultCleanPath(target);
  if (!vaultReferenceable(value)) return [];
  const key=value.toLocaleLowerCase('de');
  const compare=text=>String(text||'').normalize('NFC').toLocaleLowerCase('de');
  const stem=text=>compare(text).replace(/\.md$/,'');
  const full=String(target).startsWith('./')||value.includes('/');
  const localName=entry=>entry.path.split('/').at(-1);
  if (full) {
    const exact=entries.filter(entry=>entry.path===value);
    return exact.length?exact:entries.filter(entry=>stem(entry.path)===stem(value));
  }
  return entries.filter(entry=>vaultReferenceable(entry.path)&&(compare(entry.id)===key||stem(localName(entry))===stem(value)||compare(entry.title)===key));
}

function vaultPublic(entry,path=entry.path) {
  return {path,title:entry.title,kind:entry.kind,...(entry.id?{id:entry.id}:{})};
}

function vaultResolve(target) {
  const entries=vaultEntries();
  const matches=vaultMatches(target,entries);
  if (matches.length!==1) return undefined;
  const entry=matches[0];
  const rootPath=!entry.path.includes('/')&&vaultMatches(entry.path,entries).length>1;
  return vaultPublic(entry,rootPath?`./${entry.path}`:entry.path);
}

function vaultDB() {
  if (!vaultDatabase) vaultDatabase=new Promise((resolve,reject)=>{
    const request=indexedDB.open('product-engineering-vault-v1',1);
    request.onupgradeneeded=()=>request.result.createObjectStore('assets');
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error);
    request.onblocked=()=>reject(new Error('Der lokale Dateispeicher wird von einem anderen Tab verwendet.'));
  }).catch(error=>{vaultDatabase=null;throw error;});
  return vaultDatabase;
}

async function vaultBlob(projectId,path,blob) {
  const db=await vaultDB();
  return new Promise((resolve,reject)=>{
    const transaction=db.transaction('assets',blob?'readwrite':'readonly');
    const store=transaction.objectStore('assets'),key=[projectId,path];
    const request=blob?store.put(blob,key):store.get(key);
    transaction.oncomplete=()=>resolve(blob||request.result);
    transaction.onabort=()=>reject(transaction.error||new Error('Dateizugriff abgebrochen.'));
    transaction.onerror=()=>reject(transaction.error||request.error);
  });
}

async function vaultRasterMime(file) {
  const bytes=new Uint8Array(await file.slice(0,32).arrayBuffer());
  const sig=(...values)=>values.every((v,i)=>bytes[i]===v);
  const ascii=String.fromCharCode(...bytes);
  if (sig(137,80,78,71,13,10,26,10)) return 'image/png';
  if (sig(255,216,255)) return 'image/jpeg';
  if (ascii.startsWith('GIF87a')||ascii.startsWith('GIF89a')) return 'image/gif';
  if (ascii.startsWith('RIFF')&&ascii.slice(8,12)==='WEBP') return 'image/webp';
  if (ascii.slice(4,8)==='ftyp'&&['avif','avis'].includes(ascii.slice(8,12))) return 'image/avif';
  return '';
}

async function vaultStoreFile(p,entry,embed) {
  const path=entry.path;
  let kind=vaultFileKind(path);
  if (kind==='image'&&!await vaultRasterMime(entry.file)) kind='file';
  if (embed&&kind!=='image') throw new Error('Diese Datei ist kein unterstütztes Rasterbild. Füge sie als normalen Verweis ein.');
  // A directory-sourced File may retain a live disk reference when cloned into IndexedDB.
  // Taking a Blob snapshot here preserves the confirmed file even if the original moves.
  const retained=await new Response(entry.file).blob();
  if (p!==project()) throw new Error('Das Projekt wurde gewechselt.');
  await vaultBlob(p.id,path,retained);
  if (p!==project()) throw new Error('Das Projekt wurde gewechselt. Öffne den Vault-Picker im gewünschten Projekt erneut.');
  const rows=p.vaultFiles||=[];
  const index=rows.findIndex(record=>record.path===path);
  const stamp=Math.max(Date.now(),(Number(rows[index]?.stamp)||0)+1);
  const asset={path,title:entry.title,kind,stamp};
  if (index===-1) rows.push(asset); else rows[index]=asset;
  persist();
  return asset;
}

function vaultOverlay(id) {
  let dialog=$(id);
  if (!dialog) {
    dialog=document.createElement('dialog');
    dialog.id=id;
    dialog.className='vault-overlay';
    dialog.setAttribute('aria-labelledby',`${id}-title`);
    document.body.append(dialog);
    dialog.addEventListener('click',event=>{
      if (event.target.closest('[data-vault-dismiss]')) dialog.close();
    });
  }
  return dialog;
}

function vaultHeader(id,name) {
  return `<div class="dialog-head"><h2 id="${id}-title">${e(name)}</h2><button type="button" class="icon-button" aria-label="Schließen" data-vault-dismiss>${icon('cross')}</button></div>`;
}

function vaultPickerResults(state) {
  const query=$('vault-search').value.trim().toLocaleLowerCase('de');
  const matches=state.entries.filter(entry=>[entry.title,entry.path,entry.group].join(' ').toLocaleLowerCase('de').includes(query));
  $('vault-match-count').textContent=`${matches.length} Treffer`;
  const list=$('vault-results');
  list.innerHTML=matches.slice(0,state.limit).map(entry=>{
    const usable=vaultReferenceable(entry.path);
    return `<li><button type="button" data-vault-select="${e(entry.path)}" aria-label="${e(entry.path)}" aria-pressed="${state.selected===entry.path}"${usable?'':' disabled'}>${icon(entry.kind==='image'?'proto':entry.kind==='item'?'backlog':'file')}<span><strong>${e(entry.title)}</strong><small>${e(entry.group)} · ${e(entry.path)}${usable?'':' · Für einen Wikilink bitte umbenennen.'}</small></span>${state.selected===entry.path?icon('check'):''}</button></li>`;
  }).join('')||`<li class="empty">Keine passenden Verweise. Ändere den Suchbegriff oder wähle einen lokalen Ordner aus.</li>`;
  $('vault-more').hidden=matches.length<=state.limit;
  const selected=state.entries.find(entry=>entry.path===state.selected);
  $('vault-picked').textContent=selected?selected.path:'';
  $('vault-confirm').disabled=!selected||state.busy;
  $('vault-embed').hidden=!selected||selected.kind!=='image'||!state.allowEmbed;
  $('vault-embed').disabled=state.busy;
}

function vaultBrowseFiles(state,files,isDirectory) {
  if (!files.length) return;
  const reserved=new Set(state.entries.filter(entry=>entry.id).map(entry=>entry.path.toLocaleLowerCase('de')));
  const collisions=[];
  const catalog=vaultCatalog(state.project);
  if (isDirectory) catalog.clear();
  let last='',count=0;
  for (const file of files) {
    const parts=isDirectory?file.webkitRelativePath.split('/').slice(1):[file.name];
    if (parts.some(part=>part.startsWith('.')||['node_modules','vendor'].includes(part.toLowerCase()))) continue;
    const path=vaultCleanPath(parts.join('/'));
    if (!path) continue;
    if (reserved.has(path.toLocaleLowerCase('de'))) {collisions.push(path);continue;}
    catalog.set(path,file); last=path; count++;
  }
  state.entries=vaultEntries();
  state.selected=!isDirectory&&count===1&&vaultReferenceable(last)?last:'';
  state.limit=60;
  $('vault-search').value='';
  const message=isDirectory?`${count} Dateien im Ordner gefunden. Wähle einen Verweis aus.`:'';
  $('vault-result-message').textContent=collisions.length?`${collisions[0]} ist bereits ein Projektverweis. Wähle den übergeordneten Vault-Ordner oder benenne die lokale Datei um.`:message;
  vaultPickerResults(state);
  $('vault-search').focus();
}

async function vaultAccept(state,embed) {
  if (state!==vaultPickerState||state.busy||state.project!==project()) return;
  const entry=state.entries.find(item=>item.path===state.selected);
  if (!entry||!vaultReferenceable(entry.path)||(embed&&(!state.allowEmbed||entry.kind!=='image'))) return;
  state.busy=true; vaultPickerResults(state);
  let chosen;
  try {
    chosen=entry.file?await vaultStoreFile(state.project,entry,embed):entry;
  } catch(error) {
    if (state!==vaultPickerState||!$('vault-picker').open) return;
    state.busy=false;
    $('vault-result-message').textContent=error.message?.includes('Rasterbild')?error.message:'Die Datei konnte nicht lokal gespeichert werden. Prüfe den verfügbaren Browser-Speicher und versuche es erneut.';
    vaultPickerResults(state); return;
  }
  if (state!==vaultPickerState||!$('vault-picker').open||state.project!==project()) return;
  const path=!entry.path.includes('/')&&vaultMatches(entry.path,state.entries).length>1?`./${entry.path}`:entry.path;
  $('vault-picker').close();
  vaultPickerState=null;
  state.callback(vaultPublic(chosen,path),{embed});
}

function chooseVaultReference(callback,options={}) {
  if (typeof callback!=='function') return;
  const dialog=vaultOverlay('vault-picker');
  const state={project:project(),entries:vaultEntries(),selected:'',limit:60,allowEmbed:options.allowEmbed!==false,busy:false,callback};
  vaultPickerState=state;
  dialog.innerHTML=vaultHeader('vault-picker','Vault-Verweis auswählen')+`<div class="dialog-body vault-picker-body"><div class="vault-search"><label for="vault-search">Vault durchsuchen</label><input type="search" id="vault-search" placeholder="Titel, Kennung oder Dateipfad"></div>
    <div class="vault-file-buttons"><button type="button" class="btn small" id="vault-pick-folder">${icon('folder')} Vault-Ordner auswählen</button><input type="file" hidden id="vault-folder" aria-label="Vault-Ordner auswählen" webkitdirectory multiple>
    <button type="button" class="btn small" id="vault-pick-files">${icon('file')} Dateien auswählen</button><input type="file" hidden id="vault-files" aria-label="Dateien auswählen" multiple></div>
    <p class="muted vault-hint">Lokale Dateien bleiben im Browser. Erst beim Einfügen wird die gewählte Datei für dieses Projekt gespeichert.</p>
    <p id="vault-result-message" class="muted" role="status"></p><p id="vault-match-count" class="muted"></p><ul id="vault-results" class="vault-results"></ul>
    <button type="button" class="btn small quiet" id="vault-more">Weitere Treffer anzeigen</button></div>
    <div class="vault-picker-actions"><small id="vault-picked" class="muted"></small><div class="inline wrap"><button type="button" class="btn primary" id="vault-confirm">Verweis einfügen</button><button type="button" class="btn" id="vault-embed">Bild einbetten</button><button type="button" class="btn quiet" data-vault-dismiss>Abbrechen</button></div></div>`;
  $('vault-search').oninput=()=>{state.limit=60;state.selected='';vaultPickerResults(state);};
  $('vault-more').onclick=()=>{state.limit+=60;vaultPickerResults(state);};
  $('vault-pick-folder').hidden=!('webkitdirectory' in $('vault-folder'));
  $('vault-pick-folder').onclick=()=>$('vault-folder').click();
  $('vault-pick-files').onclick=()=>$('vault-files').click();
  $('vault-folder').onchange=event=>vaultBrowseFiles(state,event.target.files,true);
  $('vault-files').onchange=event=>vaultBrowseFiles(state,event.target.files,false);
  $('vault-results').onclick=event=>{
    const button=event.target.closest('[data-vault-select]');
    if (!button||button.disabled||state.busy) return;
    state.selected=button.dataset.vaultSelect;vaultPickerResults(state);
    [...$('vault-results').querySelectorAll('button')].find(el=>el.dataset.vaultSelect===state.selected)?.focus({preventScroll:true});
  };
  $('vault-confirm').onclick=()=>vaultAccept(state,false);
  $('vault-embed').onclick=()=>vaultAccept(state,true);
  dialog.onclose=()=>{if (!dialog.open&&vaultPickerState===state) vaultPickerState=null;};
  vaultPickerResults(state);
  if (!dialog.open) dialog.showModal();
  $('vault-search').focus();
}


function vaultHeading(root,heading) {
  if (!heading) return;
  const normalize=value=>value.trim().normalize('NFC').replace(/\s+/g,' ').toLocaleLowerCase('de');
  const expected=normalize(heading.split('#').at(-1));
  const found=[...root.querySelectorAll('h1,h2,h3,h4,h5,h6')].find(h=>normalize(h.textContent)===expected);
  if (!found) {toast(`Abschnitt „${heading}“ wurde nicht gefunden.`);return;}
  found.tabIndex=-1;
  found.focus({preventScroll:true});
  found.scrollIntoView({block:'center'});
}

function vaultDropImage(img) {
  const binding=vaultImageBindings.get(img);
  if (!binding) return;
  if (binding.url) URL.revokeObjectURL(binding.url);
  if (binding.url&&img.getAttribute('src')===binding.url) img.removeAttribute('src');
  vaultImageBindings.delete(img);
}

async function hydrateVaultImages(root=document) {
  const p=project();
  const images=[...(root.matches?.('img[data-vault-image]')?[root]:[]),...root.querySelectorAll('img[data-vault-image]')];
  await Promise.all(images.map(async img=>{
    const entry=vaultResolve(img.dataset.vaultImage);
    const path=entry&&vaultCleanPath(entry.path);
    const stored=entry?.kind==='image'&&(p.vaultFiles||[]).find(asset=>asset.path===path);
    const binding=vaultImageBindings.get(img);
    if (!stored) {vaultDropImage(img);return;}
    if (binding?.project===p&&binding.path===path&&binding.stamp===stored.stamp) return;
    vaultDropImage(img);
    const current={project:p,path,stamp:stored.stamp,url:''};
    vaultImageBindings.set(img,current);
    try {
      const file=await vaultBlob(p.id,path);
      const mime=file&&await vaultRasterMime(file);
      if (vaultImageBindings.get(img)!==current) return;
      if (!mime||p!==project()||!img.isConnected) {vaultDropImage(img);return;}
      current.url=URL.createObjectURL(new Blob([file],{type:mime}));
      img.src=current.url;
    } catch {if (vaultImageBindings.get(img)===current) vaultDropImage(img);}
  }));
}

new MutationObserver(()=>{
  for (const [img,binding] of vaultImageBindings) {
    if (!img.isConnected||binding.project!==project()||vaultCleanPath(img.dataset.vaultImage)!==binding.path) vaultDropImage(img);
  }
}).observe(document.body,{subtree:true,childList:true});

async function vaultOpen(target,heading='') {
  const preview=$('vault-preview');
  if (!target&&heading) {
    vaultHeading(preview?.open?preview:$('workspace'),heading);
    return;
  }
  const p=project(),entry=vaultResolve(target);
  if (entry?.id) {
    const open=()=>{
      if (preview?.open) preview.close();
      if (entry.kind==='doc') {ui.docTab='Inhalt';go('doc',entry.id);vaultHeading($('workspace'),heading);return;}
      const item=backlogItem(entry.id);
      if (getUseCase(entry.id)) {ui.pbiTab='Use-Case';go('usecase',entry.id);vaultHeading($('workspace'),heading);}
      else if (item&&workTypes.includes(item.type)) workForm(item.parent,item.type,item);
      else if (item) editBacklog(entry.id);
      else if ((p.nfrs||[]).some(r=>r.id===entry.id)) nfrForm(entry.id);
    };
    if ((entry.kind==='doc'||getUseCase(entry.id))&&activeDirtyEditor()) {
      if (preview?.open) preview.close();
      confirmEditorExit(open);
    } else open();
    return;
  }
  const dialog=vaultOverlay('vault-preview');
  const token={urls:[]};
  if (vaultPreviewToken) vaultPreviewToken.urls.forEach(url=>URL.revokeObjectURL(url));
  vaultPreviewToken=token;
  dialog.onclose=()=>{
    if (dialog.open) return;
    token.urls.forEach(url=>URL.revokeObjectURL(url));
    if (vaultPreviewToken===token) vaultPreviewToken=null;
  };
  const message=entry?'Datei wird geöffnet.':vaultMatches(target,vaultEntries(p)).length>1?'Der Dateiname ist mehrdeutig. Wähle die Datei mit ihrem vollständigen Pfad.':'Dieses Ziel ist im aktuellen Projekt nicht verfügbar. Über den Vault-Picker kannst du die Datei lokal auswählen.';
  dialog.innerHTML=vaultHeader('vault-preview',entry?.title||'Vault-Verweis öffnen')+`<div class="dialog-body vault-reader"><p>${e(entry?.path||target)}</p><div id="vault-read-content" aria-live="polite"><p class="muted">${e(message)}</p></div></div>`;
  if (!dialog.open) dialog.showModal();
  dialog.querySelector('button').focus();
  if (!entry) return;
  try {
    const path=vaultCleanPath(entry.path);
    const stored=(p.vaultFiles||[]).find(asset=>asset.path===path);
    const external=vaultCatalog(p).get(path);
    // Following a reference explicitly opens that file. Only picker confirmation persists a copy.
    const file=stored?await vaultBlob(p.id,path):external;
    if (!file) throw new Error('missing');
    let content='';
    const safeText=entry.kind==='markdown'||/\.(txt|csv|log|json|ya?ml)$/i.test(path);
    if (safeText) {
      const max=512*1024;
      const raw=await file.slice(0,max).text();
      content=entry.kind==='markdown'?`<article class="document prose vault-note">${markdownHTML(raw)}</article>`:`<pre class="markdown-reading">${e(raw)}</pre>`;
      if (file.size>max) content+=notice('Die Vorschau zeigt die ersten 512 KiB. Die vollständige Datei steht zum Download bereit.');
    } else if (entry.kind==='image') {
      const mime=await vaultRasterMime(file);
      if (mime) {
        if (vaultPreviewToken!==token||!dialog.open||project()!==p) return;
        const src=URL.createObjectURL(new Blob([file],{type:mime}));
        token.urls.push(src);
        content=`<img class="vault-full-image" src="${src}" alt="${e(entry.title)}">`;
      }
    }
    if (vaultPreviewToken!==token||!dialog.open||project()!==p) return;
    const href=URL.createObjectURL(new Blob([file],{type:'application/octet-stream'}));
    token.urls.push(href);
    const area=$('vault-read-content');
    area.innerHTML=(content||'<p>Dieses Dateiformat steht als Download bereit.</p>')+`<p class="space-top"><a class="btn" href="${href}" download="${e(path.split('/').at(-1))}">${icon('download')}Datei herunterladen</a></p>`;
    await hydrateVaultImages(area);
    if (dialog.open&&vaultPreviewToken===token) vaultHeading(area,heading);
  } catch {
    if (dialog.open&&vaultPreviewToken===token) $('vault-read-content').innerHTML=notice('Die lokale Datei konnte nicht gelesen werden. Wähle sie im Vault-Picker erneut aus.','warn');
  }
}


function bind() {
  bindAiWorkspace();
  bindDomainCanvas();
  window.addEventListener('ai-config-changed',()=>{
    const open=$('dialog').querySelector('[data-form="ai-generate-html"],[data-form="ai-apply-proposal"]');
    if(open && $('dialog').open) hideDialog();
  });
  document.addEventListener('click',event=>{
    const menu=document.querySelector('.note-actions[open]');
    if (menu && !menu.contains(event.target)) menu.open=false;
    action(event);
  });
  document.addEventListener('submit',submit);
  document.addEventListener('submit',syncMapContextCounts);
  document.addEventListener('change',change);
  document.addEventListener('input',filterInput);
  document.addEventListener('selectionchange',trackEditorSelection);
  document.addEventListener('paste',event=>{
    if (event.target.closest('[data-rich-editor]')&&event.clipboardData) {
      event.preventDefault(); document.execCommand('insertText',false,event.clipboardData.getData('text/plain'));
    }
  });
  document.addEventListener('dragstart',dragStart);
  document.addEventListener('dragover',dragOver);
  document.addEventListener('dragend',dragEnd);
  document.addEventListener('drop',dropBacklog);
  document.addEventListener('keydown',event=>{
    const noteMenu=event.target.closest?.('.note-actions[open]');
    if (event.key==='Escape' && noteMenu) {
      event.preventDefault();noteMenu.open=false;noteMenu.querySelector('summary').focus();return;
    }
    if(event.key==='Escape'&&event.target.closest('.map-context')&&expandedMapContext) {
      event.preventDefault();toggleMapContext(currentStoryMap(),expandedMapContext.key);return;
    }
    if (event.key==='Escape' && event.target.closest('#dialog [data-input="palette"]')) {
      event.preventDefault(); hideDialog(); return;
    }
    if ((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k') {
      event.preventDefault();
      if (!$('dialog').open) search();
    }
    if ((event.ctrlKey||event.metaKey)&&!event.shiftKey&&event.key.toLowerCase()==='z'&&ui.route==='backlog'&&!$('dialog').open&&!event.target.closest?.('input, textarea, select, [contenteditable]')&&ui.backlogUndo?.project===project().id) { event.preventDefault(); undoBacklog(); }
    if (event.target.closest?.('.palette-option') && ['ArrowUp','ArrowDown'].includes(event.key)) {
      event.preventDefault();
      const buttons=[...$('palette-items').querySelectorAll('button')];
      const index=buttons.indexOf(event.target.closest('.palette-option'))+(event.key==='ArrowUp'?-1:1);
      (index<0?$('dialog').querySelector('[data-input="palette"]'):buttons[Math.min(index,buttons.length-1)])?.focus();
    }
    if (event.target.dataset?.input==='palette' && ['Enter','ArrowDown'].includes(event.key)) {
      const first=$('palette-items').querySelector('button');
      if (first) { event.preventDefault(); if(event.key==='Enter') first.click(); else first.focus(); }
    }
  });
  $('dialog').addEventListener('click',event=>{
    if (event.target!==$('dialog')) return;
    const rect=event.target.getBoundingClientRect();
    if (event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom) hideDialog();
  });
  $('dialog').addEventListener('close',()=>{
    if ($('dialog').open) return;
    if (document.activeElement===document.body) (dialogTrigger?.isConnected?dialogTrigger:$('workspace')).focus({preventScroll:true});
    dialogTrigger=null;
    if (pendingEditorAction) {
      const stay=onEditorResume;
      pendingEditorAction=null; onEditorResume=null;
      stay?.(); resumeEditor();
    }
  });
  const closeDrawer=()=>ui.sidebar?toggleNavigation(false):closeInspector();
  $('drawer').addEventListener('cancel',event=>{ event.preventDefault(); closeDrawer(); });
  $('drawer').addEventListener('click',event=>{
    if (event.target!==$('drawer')) return;
    const bounds=$('drawer').getBoundingClientRect();
    if (event.clientX<bounds.left || event.clientX>bounds.right) closeDrawer();
  });
  compactNavigation.addEventListener('change',()=>{ ui.sidebar=false; syncPanels(); });
  floatingContext.addEventListener('change',syncPanels);
  document.querySelector('.skip').addEventListener('click',event=>{
    event.preventDefault();
    focusWorkspace();
    $('workspace').scrollIntoView({block:'start'});
  });
  window.addEventListener('hashchange',handleHistoryNavigation);
}

setupBacklogs();
setupWorkflow();
setupStoryMaps();
setupGit();
seedSnapshot();
populateLegacyGates();
persist();
syncRoute();
bind();
render();
</script>
</body>
