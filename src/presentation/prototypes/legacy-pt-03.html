<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSV-Export in der Fallübersicht</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf9fc;color:#282438;font:1rem/1.55 'Segoe UI',system-ui,sans-serif}
main{width:min(100%,59rem);margin:auto;padding:clamp(1rem,4vw,3rem)}h1{margin:0;font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.15;overflow-wrap:anywhere}
p{margin:.4rem 0 1.6rem;color:#5e596e}.tools{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin-bottom:.85rem}
label{display:inline-flex;align-items:center;gap:.5rem}button,select{max-width:100%;min-height:2.5rem;border:1px solid #cbc7d9;border-radius:.45rem;padding:.4rem .75rem;font:inherit;background:white;color:inherit}
button{background:#583ac2;color:white;border-color:#583ac2;font-weight:650;cursor:pointer}button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid #583ac2;outline-offset:3px}.results{overflow-x:auto;border:1px solid #dedce8;border-radius:.7rem;background:white}
table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #eae8ef;padding:.7rem .85rem}th{font-size:.83rem;color:#5e596e;background:#f6f5f9}tbody tr:last-child td{border-bottom:0}
#empty{margin:0;padding:.85rem}.tools button{overflow-wrap:anywhere}
</style></head><body><main>
<h1>CSV-Export in der Fallübersicht</h1><p>Kundenportal · Testdaten · Revision 2</p>
<div class="tools"><label>Status <select id="status"><option value="Alle">Alle Status</option><option>Offen</option><option>Abgeschlossen</option><option>Ohne Treffer</option></select></label><button id="export" type="button">CSV exportieren</button></div>
<div class="results" role="region" aria-label="Servicefälle" tabindex="0"><table><thead><tr><th scope="col">ID</th><th scope="col">Fall</th><th scope="col">Kontakt</th><th scope="col">Status</th></tr></thead><tbody><tr data-status="Offen"><td>SF-1042</td><td>Versandstatus aktualisieren</td><td>Nora Stein</td><td>Offen</td></tr><tr data-status="Offen"><td>SF-1043</td><td>Kontakt zum Serviceteam</td><td>Nora Stein</td><td>Offen</td></tr><tr data-status="Abgeschlossen"><td>SF-1044</td><td>Bestellübersicht prüfen</td><td>Ben Koch</td><td>Abgeschlossen</td></tr></tbody></table><p id="empty" role="status" hidden>Keine Servicefälle für diesen Status.</p></div>
</main><script>
const statusFilter=document.getElementById('status');
const exportButton=document.getElementById('export');
const rows=[...document.querySelectorAll('[data-status]')];
statusFilter.onchange=()=>{
  rows.forEach(row=>row.hidden=statusFilter.value!=='Alle' && row.dataset.status!==statusFilter.value);
  exportButton.disabled=rows.every(row=>row.hidden);
  document.getElementById('empty').hidden=!exportButton.disabled;
};
exportButton.onclick=()=>{
  const data=['ID;Fall;Kontakt;Status',...rows.filter(row=>!row.hidden).map(row=>[...row.cells].map(cell=>cell.textContent).join(';'))].join('\n');
  const file=document.createElement('a');
  file.href=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));
  file.download='servicefaelle-demo.csv';file.click();
  setTimeout(()=>URL.revokeObjectURL(file.href),1000);
};
</script></body></html>
